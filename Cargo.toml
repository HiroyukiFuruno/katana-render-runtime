[workspace]
members = [
    "crates/kdr-linter",
    "crates/katana-render-runtime",
    "crates/katana-render-runtime-assets",
    "crates/katana-render-runtime-cli",
]
resolver = "2"

# WHY: 行情報を保ったまま生成物のデバッグ情報を縮小し、最適化・検査・増分設定は維持する。
[profile.dev]
debug = 1

# WHY: 通常の開発用行情報を維持し、coverage専用の生成物だけ縮小する。
[profile.krr-coverage]
inherits = "dev"
debug = 0
incremental = false

[workspace.package]
version = "0.4.24"
edition = "2024"
license = "MIT"
repository = "https://github.com/HiroyukiFuruno/katana-render-runtime"
rust-version = "1.95.0"
authors = ["Hiroyuki Furuno"]
description = "Versioned render runtime for KatanA diagrams and math (Mermaid, Draw.io, ZenUML, PlantUML, MathJax)."

[workspace.dependencies]
katana-render-runtime = { path = "crates/katana-render-runtime", version = "0.4.24" }
katana-render-runtime-assets = { path = "crates/katana-render-runtime-assets", version = "=0.4.24" }
katana-ast-lint = "0.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "=3.27.0"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
object = { version = "0.40.0", default-features = false, features = ["read", "std"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "3", features = ["full", "visit"] }
toml = "1.1"
base64 = "0.23"
brotli-decompressor = "6.1.0"
include_dir = "0.7.4"
jni = { version = "0.22.4", features = ["invocation"] }
resvg = "0.48"
rustybuzz = "0.20.1"
harfrust = "0.14.0"
sha2 = "0.11"
tiny-skia = "0.12"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
v8 = "=152.2.0"
html5ever = "0.40"
markup5ever = "0.40"
tendril = "0.5"
xml5ever = "0.40"
xmltree = "0.12"
percent-encoding = "2.3"
cssparser = "0.38"
taffy = { version = "0.15.0", default-features = false, features = ["std", "taffy_tree", "block_layout", "flexbox", "grid", "content_size", "parse"] }
unicode-linebreak = "0.1.5"
unicode-width = "0.2.2"
