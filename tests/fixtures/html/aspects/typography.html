<h1>文章表示の観点</h1><p class="mixed"><strong>日本語と English</strong> を混在させた段落。太字と通常文字の折返し境界を確認する架空の説明文です。</p><p class="nowrap">折り返さない長いラベルの表示状態を確認するための十分に長い架空のテキストです。</p><p id="long-line" style="max-width:24rem">幅を制限した段落に長い日本語と English の文章を配置し、viewportごとの折り返しと複数行の表示を実際に観察します。文章の後半も続き、短い一行だけにならないようにします。</p><p class="vertical">縦書き</p>
