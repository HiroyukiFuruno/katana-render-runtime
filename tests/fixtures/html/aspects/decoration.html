<!doctype html><meta charset="utf-8"><title>装飾と重なり</title>
<style>body{margin:24px;font-family:system-ui;background:#edf2f7;color:#182230}.surface{padding:24px;border-radius:12px;background:linear-gradient(135deg,#fff,#d9e8f5);box-shadow:0 8px 24px #24364a44}.stack{position:relative;height:150px}.alert,.overlay{position:absolute;padding:16px;border-radius:8px}.alert{inset:20px 80px auto 20px;background:#fff4d6;border:1px solid #a87515;z-index:2}.overlay{inset:60px 20px auto 110px;background:#4477aa99;clip-path:inset(0 0 15px round 6px);opacity:.8}</style>
<main class="surface"><h1>装飾面</h1><div class="stack"><div class="alert">注意を示す架空の通知</div><div class="overlay">重なり面</div></div></main>
