<!doctype html><meta charset="utf-8"><div id="observed" style="width:40px;height:20px"></div><output id="state"></output><script>const node=document.querySelector('#observed'),state=document.querySelector('#state'),log=[],publish=()=>{state.textContent=JSON.stringify(log)};new MutationObserver(()=>{log.push('mutation');publish()}).observe(node,{attributes:true,childList:true});const probe=new MutationObserver(()=>log.push('unexpected'));probe.observe(node,{attributes:true});node.dataset.probe='yes';if(probe.takeRecords().length===1)log.push('takeRecords');probe.disconnect();new IntersectionObserver(()=>{if(!log.includes('intersection'))log.push('intersection');publish()}).observe(node);new ResizeObserver(()=>{if(!log.includes('resize'))log.push('resize');publish()}).observe(node);node.dataset.ready='yes';node.textContent='変化';</script><script type="application/json" id="expected-state">["takeRecords","mutation","resize","intersection"]</script>
