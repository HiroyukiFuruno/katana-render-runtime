-flowchart .node path{fill:#2D2D2D;stroke:#ccc;stroke-width:1px;}#official-01-flowchart .rough-node .label text,#official-01-flowchart .node .label text,#official-01-flowchart .image-shape .label,#official-01-flowchart .icon-shape .label{text-anchor:middle;}#official-01-flowchart .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#official-01-flowchart .rough-node .label,#official-01-flowchart .node .label,#official-01-flowchart .image-shape .label,#official-01-flowchart .icon-shape .label{text-align:center;}#official-01-flowchart .node.clickable{cursor:pointer;}#official-01-flowchart .root .anchor path{fill:#AAAAAA!important;stroke-width:0;stroke:#AAAAAA;}#official-01-flowchart .arrowheadPath{fill:lightgrey;}#official-01-flowchart .edgePaths .path{stroke:#AAAAAA;stroke-width:1px;}#official-01-flowchart .flowchart-link{stroke:#AAAAAA;fill:none;}#official-01-flowchart .edgeLabel{background-color:#2D2D2D;text-align:center;}#official-01-flowchart .edgeLabel p{background-color:#2D2D2D;}#official-01-flowchart .edgeLabel rect{opacity:0.5;background-color:#2D2D2D;fill:#2D2D2D;}#official-01-flowchart .labelBkg{background-color:rgba(45, 45, 45, 0.5);}#official-01-flowchart .cluster rect{fill:transparent;stroke:#888888;stroke-width:1px;}#official-01-flowchart .cluster text{fill:#e0e0e0;}#official-01-flowchart .cluster span{color:#e0e0e0;}#official-01-flowchart .node .collapsed-indicator{fill:#888888;stroke:none;opacity:0.6;}#official-01-flowchart .node .collapsed-separator{stroke:#888888;stroke-width:0.75px;}#official-01-flowchart div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:#2D2D2D;border:1px solid rgba(255, 255, 255, 0.25);border-radius:2px;pointer-events:none;z-index:100;}#official-01-flowchart .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#e0e0e0;}#official-01-flowchart rect.text{fill:none;stroke-width:0;}#official-01-flowchart .icon-shap