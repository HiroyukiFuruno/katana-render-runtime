[package]
name = "krr-html-performance-harness"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

# WHY: 行情報を保ったまま生成物のデバッグ情報を縮小し、最適化・検査・増分設定は維持する。
[profile.dev]
debug = 1

# WHY: coverage専用成果物のdebug情報と増分状態を抑え、通常のdev生成物を維持する。
[profile.krr-coverage]
inherits = "dev"
debug = 0
incremental = false

[features]
baseline = ["dep:baseline"]
candidate = ["dep:candidate", "dep:image", "dep:url"]

[dependencies]
baseline = { package = "katana-render-runtime", version = "=0.4.23", registry = "crates-io", optional = true }
candidate = { package = "katana-render-runtime", path = "../../../crates/katana-render-runtime", optional = true }
sha2 = "0.11"
nix = { version = "0.31.3", default-features = false, features = ["resource"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
url = { version = "2.5.8", optional = true }

[dev-dependencies]
tempfile = "3"
