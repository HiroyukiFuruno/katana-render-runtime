[package]
name = "krr-html-performance-harness"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

# WHY: 行情報を保ったまま生成物のデバッグ情報を縮小し、最適化・検査・増分設定は維持する。
[profile.dev]
debug = 1

[features]
baseline = ["dep:baseline"]
candidate = ["dep:candidate"]

[dependencies]
baseline = { package = "katana-render-runtime", version = "=0.4.23", registry = "crates-io", optional = true }
candidate = { package = "katana-render-runtime", path = "../../../crates/katana-render-runtime", optional = true }
sha2 = "0.11"
libc = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
