name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example v0.1.0. Defaults to Cargo.toml version."
        required: false
        type: string
      publish_crates:
        description: "Publish workspace crates to crates.io"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: read
  checks: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  release-context:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    permissions:
      actions: read
      contents: read
      pull-requests: read
      checks: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      eligible: ${{ steps.version.outputs.eligible }}
      sha: ${{ steps.version.outputs.sha }}
      release_branch: ${{ steps.version.outputs.release_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Verify completed merged release context
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/release/verify_completed_release_context.py \
            --version "${REQUESTED_VERSION}" --github-output "${GITHUB_OUTPUT}"

      - name: Checkout verified merge source
        if: steps.version.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.sha }}
          fetch-depth: 0

      - name: Install just
        if: steps.version.outputs.eligible == 'true'
        uses: taiki-e/install-action@53aaa72a1fed2d5b9189d6d54c38e29bf9be2ab9 # just

      - name: Install Bun
        if: steps.version.outputs.eligible == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install JavaScript dependencies
        if: steps.version.outputs.eligible == 'true'
        run: bun install --frozen-lockfile

      - name: Release target check
        if: steps.version.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_PUBLISHED_PREFIX: "true"
        run: just VERSION="${{ steps.version.outputs.version }}" release-target-check

  release:
    needs: release-context
    if: needs.release-context.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-context.outputs.sha }}
          fetch-depth: 0

      - name: Install Linux runtime test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk graphviz

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-ubuntu-stable-publish

      - name: Install just
        uses: taiki-e/install-action@53aaa72a1fed2d5b9189d6d54c38e29bf9be2ab9 # just

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Acquire completed exact-source paired performance evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: just html-performance-evidence-acquire

      - name: Verify release package
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_PUBLISHED_PREFIX: "true"
        run: just VERSION="${{ needs.release-context.outputs.version }}" release-verify

      - name: Reverify completed release identity before publication
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.release-context.outputs.sha }}
          REQUESTED_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          test "$(git --no-replace-objects rev-parse HEAD)" = "${EXPECTED_SHA}"
          python3 scripts/release/verify_completed_release_context.py \
            --head "${EXPECTED_SHA}" --version "${REQUESTED_VERSION}" \
            --acquisition-receipt tmp/html-performance-release-evidence/acquisition.json

      - name: Create release tag
        env:
          TAG: ${{ needs.release-context.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release/create-release-tag.sh "${TAG}" origin

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-context.outputs.version }}
        run: |
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --verify-tag --draft --generate-notes
          fi

      - name: Publish crates.io
        if: github.event_name == 'workflow_run' || inputs.publish_crates == true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/release/publish-crates.sh "${{ needs.release-context.outputs.version }}"

      # 一部公開失敗を再試行できるよう、registry確認完了後にGitHub Releaseを公開する。
      - name: Publish complete GitHub Release
        if: github.event_name == 'workflow_run' || inputs.publish_crates == true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-context.outputs.version }}
        run: gh release edit "${TAG}" --draft=false --latest --verify-tag

      - name: Cleanup published release state
        if: github.event_name == 'workflow_run' || inputs.publish_crates == true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ needs.release-context.outputs.release_branch }}
        run: |
          python3 scripts/release/cleanup_release_state.py \
            --version "${{ needs.release-context.outputs.version }}" \
            --release-branch "${RELEASE_BRANCH}" \
            --remote origin \
            --default-branch master
