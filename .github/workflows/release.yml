name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example v0.1.0. Defaults to Cargo.toml version."
        required: false
        type: string
      publish_crates:
        description: "Publish workspace crates to crates.io"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  release-context:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'release/v')
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      eligible: ${{ steps.version.outputs.eligible }}
      sha: ${{ steps.version.outputs.sha }}
      release_branch: ${{ steps.version.outputs.release_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve merged publication target
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/release/verify_completed_release_context.py \
            --publication-target --head "${MERGE_SHA}" \
            --version "${REQUESTED_VERSION}" --github-output "${GITHUB_OUTPUT}"

  release:
    needs: release-context
    if: needs.release-context.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-context.outputs.sha }}
          fetch-depth: 0

      - name: Install Linux runtime test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk graphviz libfontconfig-dev libfreetype-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-ubuntu-stable-publish

      - name: Create release tag
        env:
          TAG: ${{ needs.release-context.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release/create-release-tag.sh "${TAG}" origin

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-context.outputs.version }}
        run: |
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            known_issues=()
            if [[ "$TAG" == 'v0.4.24' ]]; then
              known_issues=(--notes-file docs/releases/v0.4.24-known-issues.md)
            fi
            gh release create "${TAG}" --verify-tag --draft --generate-notes "${known_issues[@]}"
          fi

      - name: Publish crates.io
        if: github.event_name == 'pull_request' || inputs.publish_crates == true
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/release/publish-crates.sh "${{ needs.release-context.outputs.version }}"

      # 一部公開失敗を再試行できるよう、registry確認完了後にGitHub Releaseを公開する。
      - name: Publish complete GitHub Release
        if: github.event_name == 'pull_request' || inputs.publish_crates == true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-context.outputs.version }}
        run: gh release edit "${TAG}" --draft=false --latest --verify-tag

      - name: Cleanup published release state
        if: github.event_name == 'pull_request' || inputs.publish_crates == true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ needs.release-context.outputs.release_branch }}
        run: |
          python3 scripts/release/cleanup_release_state.py \
            --version "${{ needs.release-context.outputs.version }}" \
            --release-branch "${RELEASE_BRANCH}" \
            --remote origin \
            --default-branch master
