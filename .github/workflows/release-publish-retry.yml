name: Release Publish Retry

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to publish, for example v0.4.17"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: release-tools

      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Verify immutable release source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          test "$(git -C release-source rev-parse HEAD)" = "$(git -C release-source rev-list -n 1 "${RELEASE_TAG}")"
          cd release-source
          bash ../release-tools/scripts/release/verify-version.sh "${RELEASE_TAG}"

      - name: Publish crates.io from release tag
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd release-source
          bash ../release-tools/scripts/release/publish-crates.sh "${{ inputs.version }}"

      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest --verify-tag

      - name: Cleanup published release state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: release/${{ inputs.version }}
        run: |
          cd release-tools
          python3 scripts/release/cleanup_release_state.py \
            --version "${{ inputs.version }}" \
            --release-branch "${RELEASE_BRANCH}" \
            --remote origin \
            --default-branch master
