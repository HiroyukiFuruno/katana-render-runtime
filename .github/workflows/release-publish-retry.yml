name: Release Publish Retry

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to publish, for example v0.4.17"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: release-tools

      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install Python analysis tools
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Verify immutable release source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          test "$(git -C release-source rev-parse HEAD)" = "$(git -C release-source rev-list -n 1 "${RELEASE_TAG}")"
          cd release-source
          bash ../release-tools/scripts/release/verify-version.sh "${RELEASE_TAG}"

      - name: Verify completed merged release context
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          python3 release-tools/scripts/release/verify_completed_release_context.py \
            --repo release-source --head "$(git --no-replace-objects -C release-source rev-parse HEAD)" \
            --version "${RELEASE_TAG}"

      - name: Acquire completed exact-tag CI and paired performance evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          KRR_HTML_PERFORMANCE_SCIPY_VERSION=1.18.1
          uv run --isolated
          --with-requirements release-tools/scripts/release/html-performance-requirements.lock
          python release-tools/scripts/release/run_html_performance.py verify
          --repo "$GITHUB_WORKSPACE/release-source"
          --evidence-dir "$GITHUB_WORKSPACE/release-source/tmp/html-performance-release-evidence"
          --acquire

      - name: Reverify acquired completed generation before retry publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          python3 release-tools/scripts/release/verify_completed_release_context.py \
            --repo release-source --head "$(git --no-replace-objects -C release-source rev-parse HEAD)" \
            --version "${RELEASE_TAG}" \
            --acquisition-receipt release-source/tmp/html-performance-release-evidence/acquisition.json

      - name: Publish crates.io from release tag
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd release-source
          bash ../release-tools/scripts/release/publish-crates.sh "${{ inputs.version }}"

      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        # A retry can publish an older tag; preserve an existing Latest release.
        run: gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --verify-tag

      - name: Cleanup published release state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: release/${{ inputs.version }}
        run: |
          cd release-tools
          python3 scripts/release/cleanup_release_state.py \
            --version "${{ inputs.version }}" \
            --release-branch "${RELEASE_BRANCH}" \
            --remote origin \
            --default-branch master
