name: CI evidence publisher

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: read

jobs:
  publish:
    name: publish trusted Linux release-quality evidence
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate source CI and create pending Actions check
        id: manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_evidence/publish.py \
            --event "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --publisher-run-id "$GITHUB_RUN_ID" \
            --output ci-evidence/manifest.json

      - name: Upload immutable evidence manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-evidence-linux-release-quality-${{ github.event.workflow_run.id }}
          path: ci-evidence/manifest.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30

      - name: Complete Actions check after artifact upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_evidence/publish.py \
            --event "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --complete-check "${{ steps.manifest.outputs.check_run_id }}"
