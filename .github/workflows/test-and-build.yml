      - name: Measure the inline code in Linux Chrome
        if: >-
          matrix.os == 'ubuntu-latest' && github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/release/verify' && inputs.verify_platform == 'linux-fidelity' &&
          inputs.verify_filter == 'code-width'
        timeout-minutes: 5
        run: |
          node --input-type=module <<'JS'
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ channel: 'chrome' });
          try {
            const page = await browser.newPage({ viewport: { width: 620, height: 900 } });
            await page.goto(pathToFileURL(resolve('tests/fixtures/html/anonymized-requirements.html')).href);
            const code = page.locator('td code');
            if (await code.count() !== 1) throw new Error('inline code selection changed');
            await code.scrollIntoViewIfNeeded();
            const geometry = await code.evaluate(async (element) => {
              await document.fonts.ready;
              const cell = element.closest('td');
              const previous = element.previousSibling;
              if (!cell || !(previous instanceof Text)) throw new Error('table row shape changed');
              const prefix = document.createRange();
              prefix.setStart(previous, previous.length - 'URLの例は '.length);
              prefix.setEnd(previous, previous.length);
              const codeStyle = getComputedStyle(element);
              const cellStyle = getComputedStyle(cell);
              const rect = (value) => ({ x: value.x, y: value.y, width: value.width, height: value.height });
              return { code: rect(element.getBoundingClientRect()), codeFontSize: codeStyle.fontSize,
                codeFontFamily: codeStyle.fontFamily, cell: rect(cell.getBoundingClientRect()),
                padding: [cellStyle.paddingLeft, cellStyle.paddingRight],
                prefix: [...prefix.getClientRects()].map(rect) };
            });
            const cdp = await page.context().newCDPSession(page);
            await cdp.send('DOM.enable');
            await cdp.send('CSS.enable');
            const { root } = await cdp.send('DOM.getDocument');
            const { nodeId } = await cdp.send('DOM.querySelector', { nodeId: root.nodeId, selector: 'td code' });
            const { fonts } = await cdp.send('CSS.getPlatformFontsForNode', { nodeId });
            console.log('HTML_INTERACTION_CODE_CHROME', JSON.stringify({ geometry, fonts }));
          } finally {
            await browser.close();
          }
          JS

      - name: Identify fonts used by Linux Chrome for HTML
        if: >-
          matrix.os == 'ubuntu-latest' && github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/release/verify' && inputs.verify_platform == 'linux-fidelity' &&
          (inputs.verify_filter == 'font-stack' || inputs.verify_filter == 'font-geometry')
        env:
          KRR_LINUX_FONT_SCOPE: ${{ inputs.verify_filter }}
        timeout-minutes: 5
        run: |
          for family in system-ui Arial sans-serif; do
            fc-match --format='%{family}\t%{file}\n' "$family"
          done
          for locale in en-US ja; do
            for glyph in 540d 67b6 6a19 304b; do
              fc-match --format="$locale $glyph %{family[0]}\t%{file}\n" ":lang=$locale:charset=$glyph:scalable=true"
            done
          done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { pathToFileURL } from 'node:url';

          const fixtures = process.env.KRR_LINUX_FONT_SCOPE === 'font-geometry' ? [
            ['html/library-reservation-fidelity', '#column-p1'],
            ['html/aspects/input-state', '#name, #state-summary'],
          ] : [
            ['html/anonymized-requirements', '.doc-header h1, #s13 td:last-child, #s27 td:last-child'],
            ['html-diagram-consumer/mermaid-class-diagram', 'main h1, main > p, .notes li'],
            ['html-diagram-consumer/drawio-class-diagram', 'main h1, main > p, .notes li'],
            ['html/library-reservation-fidelity', 'h1, p'],
            ['html/aspects/input-state', 'h1, #state-summary, #name, #save, #accordion, #accordion-panel'],
            ['html/aspects/typography', 'h1, p'],
          ];
          function geometry(node) {
            const style = getComputedStyle(node);
            const { top, width, height } = node.getBoundingClientRect();
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            context.font = `${style.fontStyle} ${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
            const latin = context.measureText('0');
            let baseline = null;
            if (node.id === 'column-p1') {
              const marker = document.createElement('span');
              marker.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
              node.prepend(marker);
              baseline = marker.getBoundingClientRect().top - top;
              marker.remove();
            }
            return { top, width, height, baseline, fontFamily: style.fontFamily, fontSize: style.fontSize,
              fontWeight: style.fontWeight, lineHeight: style.lineHeight, zeroWidth: latin.width,
              ascent: latin.fontBoundingBoxAscent, descent: latin.fontBoundingBoxDescent,
              padding: [style.paddingLeft, style.paddingRight], border: [style.borderLeftWidth, style.borderRightWidth] };
          }
          async function compareParagraphBaselines(page) {
            return page.locator('#column-p1').evaluate((source) => {
              const families = ['inherit', 'Arial', 'sans-serif', 'Noto Sans CJK JP'];
              const variants = families.flatMap((family) => ['日本語', 'Latin'].map((value) => [family, value]));
              return variants.map(([family, value]) => {
                const paragraph = source.cloneNode(false);
                paragraph.removeAttribute('id');
                paragraph.style.fontFamily = family;
                paragraph.textContent = value;
                const marker = document.createElement('span');
                marker.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
                paragraph.prepend(marker);
                source.after(paragraph);
                const baseline = marker.getBoundingClientRect().top - paragraph.getBoundingClientRect().top;
                paragraph.remove();
                return { family, value, baseline };
              });
            });
          }
          async function compareButtonLineBoxes(page) {
            await page.locator('#accordion').click();
            return page.locator('#save').evaluate((source) => {
              const variants = [
                ['', '保存'],
                ['', 'OK'],
                ['WenQuanYi Zen Hei', '保存'],
                ['Liberation Sans', '保存'],
              ];
              return variants.map(([family, label]) => {
                const button = source.cloneNode(false);
                button.removeAttribute('id');
                if (family) button.style.fontFamily = family;
                button.textContent = label;
                source.after(button);
                const style = getComputedStyle(button);
                const size = button.getBoundingClientRect();
                const range = document.createRange();
                range.selectNodeContents(button);
                const labelRect = range.getBoundingClientRect();
                button.remove();
                return { family: style.fontFamily, label, height: size.height,
                  labelHeight: labelRect.height, labelOffset: labelRect.top - size.top,
                  padding: [style.paddingTop, style.paddingBottom],
                  border: [style.borderTopWidth, style.borderBottomWidth] };
              });
            });
          }
          const browser = await chromium.launch({ channel: 'chrome' });
          try {
            const page = await browser.newPage({ viewport: { width: 620, height: 900 } });
            const cdp = await page.context().newCDPSession(page);
            await cdp.send('DOM.enable');
            await cdp.send('CSS.enable');
            for (const [fixture, selectors] of fixtures) {
              await page.goto(pathToFileURL(`tests/fixtures/${fixture}.html`).href);
              await page.evaluate(() => document.fonts.ready);
              if (fixture === 'html/aspects/input-state') {
                const locales = await page.evaluate(() => ({ page: document.documentElement.lang, browser: navigator.language }));
                console.log('LINUX_HTML_FONT_LOCALES', JSON.stringify(locales));
                console.log('LINUX_CHROME_BUTTON_LINE_BOXES', JSON.stringify(await compareButtonLineBoxes(page)));
              }
              const { root } = await cdp.send('DOM.getDocument');
              for (const selector of selectors.split(', ')) {
                const { nodeId } = await cdp.send('DOM.querySelector', { nodeId: root.nodeId, selector });
                if (!nodeId) continue;
                const { fonts } = await cdp.send('CSS.getPlatformFontsForNode', { nodeId });
                const style = await page.locator(selector).first().evaluate(geometry);
                console.log('LINUX_CHROME_HTML_FONTS', JSON.stringify({ fixture, selector, style, fonts }));
              }
              if (fixture === 'html/library-reservation-fidelity') {
                console.log('LINUX_CHROME_PARAGRAPH_BASELINES', JSON.stringify(await compareParagraphBaselines(page)));
              }
            }
          } finally {
            await browser.close();
          }
          JS

