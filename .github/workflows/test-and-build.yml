      - name: Summarize failed Linux validation cases
        if: failure() && matrix.os == 'ubuntu-latest' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' && inputs.verify_platform == 'linux-assets'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          import xml.etree.ElementTree as xml

          root = Path("tmp/quality/runtime-script-results")
          pattern = re.compile(r"runtime-quality-owned-validation-contract-[0-9a-f]{64}-group-[0-9]{3}\.xml")
          failures = set()
          for path in sorted(root.glob("runtime-quality-owned-validation-contract-*-group-*.xml")):
              if not pattern.fullmatch(path.name) or path.is_symlink():
                  continue
              try:
                  report = xml.parse(path)
              except xml.ParseError:
                  continue
              for case in report.iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      failures.add(case.get("name", "unnamed"))

          ansi = re.compile(r"\x1b\[[0-9;]*m")
          failed_case = re.compile(r"\(fail\) ([^\r\n]+?)(?: +\[([0-9.]+m?s)\])?\s*")
          timeout = re.compile(r"\s*\^ this test timed out after [0-9]+ms\.\s*")
          timed_out = {}
          for command in sorted(root.glob("raw/run-*/group-001-command.json")):
              argv = json.loads(command.read_text())["argv"]
              if "./scripts/quality/owned-validation-contract_test.ts" not in argv:
                  continue
              stderr = command.with_name("group-001-stderr.log")
              if not stderr.is_file() or stderr.is_symlink():
                  continue
              with stderr.open(errors="replace") as stream:
                  prior_failure = None
                  for line in stream:
                      clean = ansi.sub("", line).rstrip("\r\n")
                      match = failed_case.fullmatch(clean)
                      if match:
                          failures.add(match[1])
                      if prior_failure and timeout.fullmatch(clean):
                          timed_out[prior_failure[1]] = prior_failure[2] or "unknown"
                      prior_failure = match

          def safe_name(name):
              return "".join(ch for ch in name if ch.isprintable()).strip()[:240]

          names = {safe_name(name) for name in failures}
          for name in sorted(names):
              print(f"FAILED_CASE {name}")
          for name, elapsed in sorted(timed_out.items()):
              print(f"TIMED_OUT_CASE {elapsed} {safe_name(name)}")
          print(f"FAILED_CASE_COUNT {len(names)}")
          PY

