name: CI

on:
  push:
    branches: [master]
    paths:
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "package.json"
      - "bun.lock"
      - "biome.json"
      - "tsconfig.json"
      - "moon.yml"
      - ".moon/**"
      - ".codex/**"
      - ".agents/**"
      - ".agent/**"
      - ".claude/**"
      - ".github/workflows/**"
      - "assets/**"
      - "README.md"
      - "docs/**"
      - "openspec/**"
      - "scripts/**"
      - "tests/**"
      - "crates/**"
      - "vendor/**"
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      verify_platform:
        description: Native platform for release/verify.
        required: false
        default: both
        type: choice
        options:
          - both
          - linux
          - linux-assets
          - linux-contracts
          - linux-fidelity
          - linux-validation-contract
          - windows
      verify_filter:
        description: Optional nextest filter, linux-assets test pattern, full-runtime-assets or remaining-runtime-assets, or linux-fidelity selection.
        required: false
        default: ''
        type: string
      verify_html_trace:
        description: Enable HTML phase timings in selected native test output. The requirements fixture emits its full timings even if it exceeds 60 seconds.
        required: false
        default: false
        type: boolean
      verify_html_optimized:
        description: Use the release build profile for the Windows HTML requirements timing.
        required: false
        default: false
        type: boolean

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' &&
    format('native-verify-{0}-{1}{2}{3}{4}', github.ref, inputs.verify_platform,
    inputs.verify_html_trace && '-html-trace' || '', inputs.verify_html_optimized && '-optimized' || '',
    inputs.verify_platform == 'linux-fidelity' && inputs.verify_filter != '' && format('-{0}', inputs.verify_filter) || '') ||
    format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  TEST_THREADS: "1"

jobs:
  verify-linux-validation-contract:
    name: Linux owned validation contract
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' &&
      inputs.verify_platform == 'linux-validation-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4e91bf19f0b002e888d7b27791f791cb6708cb38
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
      - name: Verify the exact candidate's owned validation contract
        run: |
          test "$(git rev-parse HEAD)" = 4e91bf19f0b002e888d7b27791f791cb6708cb38
          bun install --frozen-lockfile
          uv venv --python 3.13 "$RUNNER_TEMP/krr-asset-python"
          uv pip sync --python "$RUNNER_TEMP/krr-asset-python/bin/python3" --require-hashes scripts/release/html-performance-requirements.lock
          export PATH="$RUNNER_TEMP/krr-asset-python/bin:$PATH"
          bun test --path-ignore-patterns 'tmp/**' ./scripts/quality/owned-validation-contract_test.ts

  verify-linux-contracts:
    name: Linux automation contracts
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' &&
      inputs.verify_platform == 'linux-contracts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
      - name: Verify guarded Cargo clean contracts
        run: python3 -m unittest discover -s scripts/hooks -p run_locked_command_test.py --failfast

  static-quality:
    name: Source quality checks
    if: >-
      !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Install Python analysis tools
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install just
        uses: taiki-e/install-action@4ccefd7d26b61bbb81f4ff01165e8a6880a1bd59 # just
      - name: Install ShellCheck 0.11.0
        run: |
          curl --fail --location --output "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --version | grep -Fx 'version: 0.11.0'
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Verify validation registration before scheduling checks
        run: bun scripts/html/harness-contract-cli.ts
      - name: Run independent source checks
        env:
          MOON_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: bun run moon --concurrency 3 exec krr:source-static --on-failure continue --no-actions

  test:
    name: Test and Build
    needs: static-quality
    if: >-
      (success() || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' &&
      needs.static-quality.result == 'skipped')) &&
      !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' &&
      (inputs.verify_platform == 'linux-contracts' || inputs.verify_platform == 'linux-validation-contract')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' && (startsWith(inputs.verify_platform, 'linux') && '{"include":[{"os":"ubuntu-latest","platform":"linux64"}]}' || inputs.verify_platform == 'windows' && '{"include":[{"os":"windows-latest","platform":"win64"}]}' || '{"include":[{"os":"ubuntu-latest","platform":"linux64"},{"os":"windows-latest","platform":"win64"}]}') || '{"include":[{"os":"ubuntu-latest","platform":"linux64"},{"os":"macos-15","platform":"mac-arm64"},{"os":"windows-latest","platform":"win64"}]}') }}
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      attestations: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Prepare Windows Git checkout
        if: matrix.os == 'windows-latest'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify optional local macOS evidence
        id: mac_proof
        if: matrix.platform == 'mac-arm64' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/release/local_macos_evidence.py --verify
          --repo "${{ github.repository }}"
          --pr "${{ github.event.pull_request.number }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Report reused local macOS evidence
        if: matrix.platform == 'mac-arm64' && steps.mac_proof.outcome == 'success' && steps.mac_proof.outputs.reuse == 'true'
        run: echo 'macOS Apple Silicon checks reused from verified maintainer evidence.'

      - name: Install Java runtime
        if: (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust toolchain
        if: (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Cargo 1.100 の中間成果物配置に容量管理が対応するまでは互換版を使う。
          toolchain: "1.99.1"
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache Rust build outputs
        if: (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-v2-${{ matrix.os }}-stable-default
          cache-on-failure: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' }}

      - name: Install Bun
        if: matrix.os != 'windows-latest'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install JavaScript dependencies
        if: matrix.os != 'windows-latest'
        run: bun install --frozen-lockfile

      - name: Install Python analysis tools
        if: matrix.os == 'ubuntu-latest'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest' && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify')
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Install cargo-nextest
        if: (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.148

      - name: Install just
        uses: taiki-e/install-action@4ccefd7d26b61bbb81f4ff01165e8a6880a1bd59 # just

      - name: Install Chrome for the macOS official producer browser test
        if: matrix.platform == 'mac-arm64'
        run: bunx playwright install chrome chromium

      - name: Install capacity cleanup tool
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-sweep --version 0.8.0 --locked

      - name: Check formatting
        if: matrix.os != 'windows-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: just fmt-check

      - name: Run Windows format check
        if: matrix.os == 'windows-latest'
        run: just fmt-check

      # 正常なUbuntu Rustキャッシュを使い、V8 archive欠落時だけ描画ランタイムを再生成する。
      - name: Repair cached V8 archive on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          for target_dir in target target/llvm-cov-target; do
            if [ ! -s "$target_dir/debug/gn_out/obj/librusty_v8.a" ]; then
              cargo clean --target-dir "$target_dir" -p katana-render-runtime
            fi
          done

      - name: Initialize fixed capacity reference
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/build/initialize_ci_capacity_state.py --root "$PWD"

      - name: Check Rust types
        if: (!startsWith(inputs.verify_platform, 'linux-')) && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: cargo check --workspace --locked

      - name: Run linter
        if: (!startsWith(inputs.verify_platform, 'linux-')) && matrix.os != 'windows-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: just lint

      - name: Run AST linter
        if: matrix.os != 'windows-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: just ast-lint

      - name: Check dependency boundary
        if: (!startsWith(inputs.verify_platform, 'linux-')) && matrix.os != 'windows-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: just dependency-leak

      - name: Install ImageMagick for the macOS browser test
        if: matrix.platform == 'mac-arm64'
        run: brew install imagemagick

      - name: Run macOS official producer browser test
        if: matrix.platform == 'mac-arm64'
        run: just macos-browser-contract-test

      # rust-cache は target を復元しても rusty_v8 の静的アーカイブを復元しない場合がある。
      # macOS のリンク実行前に描画ランタイムを再構築し、公式アーカイブの取得とリンクを保証する。
      - name: Rebuild V8 static archive on macOS arm64
        if: startsWith(matrix.platform, 'mac-') && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: |
          cargo clean -p katana-render-runtime
          cargo build -p katana-render-runtime-cli --locked

      - name: Rebuild V8 static archive on Windows
        if: matrix.platform == 'win64'
        shell: pwsh
        run: |
          cargo clean -p katana-render-runtime
          cargo build -p katana-render-runtime-cli --locked






      - name: Check runtime bundle sync
        if: matrix.os != 'windows-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: just runtime-bundle-check

      - name: Install Linux runtime test prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk graphviz libfontconfig-dev libfreetype-dev

      - name: Install Graphviz for PlantUML on macOS
        if: startsWith(matrix.os, 'macos-') && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: brew install graphviz

      - name: Install PlantUML runtime
        if: >-
          (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true') &&
          !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' &&
          inputs.verify_platform == 'linux-fidelity' && inputs.verify_filter == 'font-stack')
        run: just plantuml-install

      - name: Run tests
        if: >-
          (matrix.os != 'ubuntu-latest' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' && !startsWith(inputs.verify_platform, 'linux-'))) &&
          (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true') &&
          (!(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify') || inputs.verify_filter == '')
        timeout-minutes: 45
        run: just unit-test

      - name: Run selected native tests
        if: >-
          github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' &&
          !startsWith(inputs.verify_platform, 'linux-') && inputs.verify_filter != '' &&
          !(inputs.verify_platform == 'windows' && inputs.verify_html_trace &&
          inputs.verify_filter == 'test(=renderer::backends::html_browser::session::requirements_tests::requirements_fixture_returns_fragment_frame_with_sticky_sidebar_and_closes_within_budget)')
        env:
          DEBUG: ${{ inputs.verify_html_trace && 'true' || 'false' }}
          KRR_VERIFY_FILTERSET: ${{ inputs.verify_filter }}
          NEXTEST_SUCCESS_OUTPUT: ${{ inputs.verify_html_trace && 'immediate' || 'never' }}
        shell: bash
        timeout-minutes: 45
        run: >-
          just --command cargo nextest run --workspace --all-targets --all-features
          --locked --no-fail-fast --retries 0 --no-tests fail --test-threads "$TEST_THREADS"
          --user-config-file scripts/release/nextest-local-user.toml -E "$KRR_VERIFY_FILTERSET"

      - name: Collect complete HTML requirements timings
        if: >-
          github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' &&
          inputs.verify_platform == 'windows' && inputs.verify_html_trace &&
          inputs.verify_filter == 'test(=renderer::backends::html_browser::session::requirements_tests::requirements_fixture_returns_fragment_frame_with_sticky_sidebar_and_closes_within_budget)'
        env:
          DEBUG: 'true'
          KRR_HTML_REQUIREMENTS_CHILD: '1'
          KRR_VERIFY_BUILD_PROFILE: ${{ inputs.verify_html_optimized && 'release' || 'dev' }}
          KRR_VERIFY_FILTERSET: ${{ inputs.verify_filter }}
          NEXTEST_SUCCESS_OUTPUT: immediate
        shell: bash
        timeout-minutes: 20
        run: >-
          just --command cargo nextest run --package katana-render-runtime --lib --all-features
          --cargo-profile "$KRR_VERIFY_BUILD_PROFILE"
          --locked --no-fail-fast --retries 0 --no-tests fail --test-threads "$TEST_THREADS"
          --user-config-file scripts/release/nextest-local-user.toml -E "$KRR_VERIFY_FILTERSET"

      - name: Run PlantUML smoke check
        if: (!startsWith(inputs.verify_platform, 'linux-')) && matrix.os != 'windows-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: |
          cargo run -p katana-render-runtime-cli -- plantuml render --input tests/fixtures/plantuml/representative/01-sequence.puml --output "$RUNNER_TEMP/plantuml-sequence.svg"
          grep -q '<svg' "$RUNNER_TEMP/plantuml-sequence.svg"

      - name: Run PlantUML smoke check on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "plantuml-sequence.svg"
          cargo run -p katana-render-runtime-cli -- plantuml render --input tests/fixtures/plantuml/representative/01-sequence.puml --output $output
          if (-not (Select-String -Path $output -Pattern "<svg" -Quiet)) {
            throw "PlantUML smoke output did not contain SVG"
          }


      - name: Check TypeScript formatting and lint
        if: matrix.os != 'windows-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: just biome

      - name: Check TypeScript types
        if: matrix.os != 'windows-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: just typecheck

      - name: Check runtime asset checksums
        if: matrix.os != 'windows-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: just runtime-asset-check

      - name: Check packaged runtime bundles
        if: matrix.os == 'ubuntu-latest'
        run: just runtime-bundle-package-check

      - name: Check packaged PlantUML runtime manifest
        if: matrix.os == 'ubuntu-latest'
        run: just plantuml-runtime-package-check

      - name: Install Google Chrome for independent HTML reference
        if: matrix.os == 'ubuntu-latest'
        run: bunx playwright install --with-deps chrome chromium

      - name: Install pinned ImageMagick for HTML comparison
        if: matrix.os == 'ubuntu-latest'
        env:
          IMAGEMAGICK_DIR: ${{ runner.temp }}/imagemagick
        run: |
          mkdir -p "$IMAGEMAGICK_DIR"
          cd "$IMAGEMAGICK_DIR"
          curl --fail --location --retry 3 --output imagemagick.AppImage https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-33/ImageMagick-7.1.2-33-gcc-x86_64.AppImage
          printf '%s  %s\n' af598b07ab4dd8b8123623602dc9fc69d5e32185a36fd3739795a0deb02c1fb7 imagemagick.AppImage | sha256sum --check
          chmod +x imagemagick.AppImage
          ./imagemagick.AppImage --appimage-extract > /dev/null
          mkdir -p bin
          ln -s ../squashfs-root/AppRun bin/magick
          echo "$IMAGEMAGICK_DIR/bin" >> "$GITHUB_PATH"
          bin/magick -version

      - name: Run recent Linux asset regressions
        if: >-
          matrix.os == 'ubuntu-latest' && github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/release/verify' && inputs.verify_platform == 'linux-assets' &&
          (inputs.verify_filter == 'full-runtime-assets' || inputs.verify_filter == 'remaining-runtime-assets')
        timeout-minutes: 5
        run: |
          asset_python="$RUNNER_TEMP/krr-asset-python"
          uv venv --python 3.13 "$asset_python"
          uv pip sync --python "$asset_python/bin/python3" --require-hashes scripts/release/html-performance-requirements.lock
          export PATH="$asset_python/bin:$PATH"
          bun test --path-ignore-patterns 'tmp/**' \
            --test-name-pattern '^(the actual repository binds the MathJax standard gate and retains the audit ledger|Moon fixture itself must consume both owner environment values)$' \
            ./scripts/quality/owned-validation-contract_test.ts
          bun test --path-ignore-patterns 'tmp/**' \
            --test-name-pattern '^(does not include ignored private tmp or target files|実utility sourceとstrict設定に束縛したcompilerが誤入力とDOMを拒否する|MathJax actual source rejects owned ABI, library, unknown and DOM misuse under strict compiler)$' \
            ./scripts/mermaid/native-source-manifest_test.ts ./scripts/runtime-bundles/runtime-bundle-checks_test.ts
          bun test --path-ignore-patterns 'tmp/**' \
            --test-name-pattern '^(actual TypeScript calls use the pinned compiler without a wrapper|literal RTK proxy retains pinned TypeScript classification)$' \
            ./scripts/html/harness-contract_test.ts
          bun test --path-ignore-patterns 'tmp/**' \
            --test-name-pattern '^(accepts a complete 48-entry evidence fixture while keeping acceptance false|scores a different capture separately from repeated captures in the same viewport)$' \
            ./scripts/html/compare-toc-evidence_test.ts

      - name: Run runtime asset script tests
        if: >-
          matrix.os == 'ubuntu-latest' && inputs.verify_platform != 'linux-fidelity' &&
          (inputs.verify_platform != 'linux-assets' || inputs.verify_filter == '' || inputs.verify_filter == 'full-runtime-assets' || inputs.verify_filter == 'remaining-runtime-assets')
        env:
          MOON_CONCURRENCY: "1"
          KRR_VERIFY_LINUX_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' && inputs.verify_platform == 'linux-assets' && inputs.verify_filter == '' }}
          KRR_VERIFY_LINUX_ASSET_PREPARED: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' && inputs.verify_platform == 'linux-assets' && (inputs.verify_filter == 'full-runtime-assets' || inputs.verify_filter == 'remaining-runtime-assets') }}
          KRR_VERIFY_LINUX_ASSET_REMAINING: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' && inputs.verify_platform == 'linux-assets' && inputs.verify_filter == 'remaining-runtime-assets' }}
