            --manifest "$RUNNER_TEMP/native-coverage-seed/manifest.json" \
            --context "$RUNNER_TEMP/native-coverage-seed/context.json" \
            --cache-key "$RUNNER_TEMP/native-coverage-seed/cache-key.txt" \
            --status "$RUNNER_TEMP/native-coverage-seed/status.json" \
            --cache-output tmp/quality/native-coverage-cache/manifest.json \
            --tested-sha "${{ github.sha }}" --workflow-sha "${{ github.workflow_sha }}" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          key="$(cat "$RUNNER_TEMP/native-coverage-seed/cache-key.txt")"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo 'eligible=true' >> "$GITHUB_OUTPUT"

      - name: Attest fresh coverage manifest
        id: native_coverage_attest
        if: steps.native_coverage_seed_verify.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: tmp/quality/native-coverage-cache/manifest.json

      - name: Save immutable exact-key coverage result
        if: steps.native_coverage_seed_verify.outputs.eligible == 'true' && steps.native_coverage_attest.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/quality/native-coverage-cache/manifest.json
          key: ${{ steps.native_coverage_seed_verify.outputs.key }}

  paired-performance:
    name: Native paired HTML time and RSS nonregression
    needs: test
    if: >-
      (success() && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)) ||
      (!cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' &&
      inputs.verify_platform == 'macos-stage90' && needs.test.result == 'skipped')
    runs-on: macos-15
    timeout-minutes: 360
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    steps:
      - name: Checkout exact measurement source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref == 'refs/heads/release/verify' && inputs.verify_platform == 'macos-stage90' && '6fb7525d2828bcdeb3169eccff17ed057645f8a2' || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record actual source HEAD
        id: source
        run: |
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "diagnostic=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' && inputs.verify_platform == 'macos-stage90' }}" >> "$GITHUB_OUTPUT"
          echo "font_metadata=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' && inputs.verify_platform == 'macos-stage90' && inputs.verify_filter == 'system-fonts' }}" >> "$GITHUB_OUTPUT"

      - name: Verify optional local HTML performance evidence
        id: html_local_proof
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/release/local_html_performance_evidence.py --verify
          --repository "${{ github.repository }}"
          --pr "${{ github.event.pull_request.number }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Report local HTML performance evidence
        if: steps.html_local_proof.outcome == 'success' && steps.html_local_proof.outputs.reuse == 'true'
        run: echo 'HTML performance reused from verified maintainer evidence.'

      - name: Install Rust toolchain
        if: steps.source.outputs.font_metadata != 'true' && (steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true')
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"

      - name: Install just
        if: steps.source.outputs.font_metadata != 'true' && (steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true')
        uses: taiki-e/install-action@4ccefd7d26b61bbb81f4ff01165e8a6880a1bd59 # just

      - name: Install Bun
        if: steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install JavaScript dependencies
        if: steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true'
        run: bun install --frozen-lockfile

      - name: Set up Python 3.13
        if: steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Download and verify font observer
        id: font_observer
        if: steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          observer_work="$(mktemp -d "${RUNNER_TEMP}/krr-font-observer.XXXXXXXX")"
          observer_work="$(python3 -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$observer_work")"
          archive="$observer_work/observer.tar.gz"
          # 公開前は固定CI成果物から同一のアーカイブを取得できる。
          if ! gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/702068128" > "$archive"; then
            gh run download 44800513985 --repo "$GITHUB_REPOSITORY" \
              --name krr-font-observer-v0.4.24-92102a2d --dir "$observer_work/staged"
            mv "$observer_work/staged/font-observer-macos-arm64.tar.gz" "$archive"
          fi
          python3 scripts/release/html_performance_observer_unpack.py \
            --archive "$archive" \
            --archive-sha256 92102a2dad3ef4c5f50e5581c7f12a2c7b4e291ee3c3a2804299690811e8a86f \
            --manifest-sha256 74594a04e993c89f969d6b02c42a84fe4a787d818a0bd339d7d96445380ba6dc \
            --executable-sha256 031c93c5e822ffd8d22121bb41ed139fb6fcc4e96f6aa1f43ea31ec36fb9242c \
            --output-dir "$observer_work/observer"
          echo "executable=$observer_work/observer/headless_shell" >> "$GITHUB_OUTPUT"

      - name: Inspect macOS system fonts used by Chrome
        if: steps.source.outputs.font_metadata == 'true'
        env:
          OBSERVER_EXECUTABLE: ${{ steps.font_observer.outputs.executable }}
        run: >-
          bun scripts/html/fidelity-acceptance-cli.ts catalog-stage90-system-fonts
          "$OBSERVER_EXECUTABLE"
          031c93c5e822ffd8d22121bb41ed139fb6fcc4e96f6aa1f43ea31ec36fb9242c

      - name: Inspect selected CoreText variation defaults
        if: steps.source.outputs.font_metadata == 'true'
        run: |
          xcrun swift - <<'SWIFT'
          import Foundation
          import CoreText

          func nativeCoordinates(_ dictionary: CFTypeRef?) -> [String: Double] {
              let values = dictionary as? [NSNumber: NSNumber] ?? [:]
              return Dictionary(uniqueKeysWithValues: values.map { (String($0.key.uint32Value), $0.value.doubleValue) })
          }

          func nativeDefaults(_ value: CFTypeRef?) -> [String: Double] {
              let axes = value as? [[String: Any]] ?? []
              return Dictionary(uniqueKeysWithValues: axes.compactMap { axis in
                  guard let tag = axis[kCTFontVariationAxisIdentifierKey as String] as? NSNumber,
                        let value = axis[kCTFontVariationAxisDefaultValueKey as String] as? NSNumber else { return nil }
                  return (String(tag.uint32Value), value.doubleValue)
              })
          }

          func snapshot(_ font: CTFont, label: String, request: String, character: String, size: Double) -> [String: Any] {
              let descriptor = CTFontCopyFontDescriptor(font)
              return [
                  "language": label,
                  "request": request,
                  "character": character,
                  "size": size,
                  "postScriptName": CTFontCopyPostScriptName(font) as String,
                  "explicit": nativeCoordinates(CTFontCopyVariation(font)),
                  "descriptorVariation": nativeCoordinates(CTFontDescriptorCopyAttribute(descriptor, kCTFontVariationAttribute)),
                  "axisDefaults": nativeDefaults(CTFontCopyVariationAxes(font)),
                  "descriptorAxisDefaults": nativeDefaults(CTFontDescriptorCopyAttribute(descriptor, kCTFontVariationAxesAttribute)),
              ]
          }

          func scalerCopy(_ font: CTFont, size: Double) -> CTFont {
              let opticalKey = "NSCTFontOpticalSizeAttribute"
              let trackingKey = "NSCTFontUnscaledTrackingAttribute"
              let configured = (CTFontCopyAttribute(font, opticalKey as CFString) as? NSNumber)?.doubleValue
              let optical = configured.flatMap { $0 > 0 ? $0 : nil } ?? CTFontGetSize(font)
              let attributes = [opticalKey: NSNumber(value: optical), trackingKey: NSNumber(value: 0)]
              let descriptor = CTFontDescriptorCreateWithAttributes(attributes as CFDictionary)
              return CTFontCreateCopyWithAttributes(font, size, nil, descriptor)
          }

          let languages: [(String, CFString?)] = [("system", nil), ("zh-Hans", "zh-Hans" as CFString)]
          var rows: [[String: Any]] = []
          for (label, language) in languages {
              for size in [16.0, 19.0] {
                  guard let base = CTFontCreateUIFontForLanguage(CTFontUIFontType(rawValue: 2)!, size, language) else {
                      fatalError("CoreText system-ui request failed")
                  }
                  for character in ["を", "り"] {
                      let text = character as CFString
                      let range = CFRange(location: 0, length: CFStringGetLength(text))
                      let selected = CTFontCreateForStringWithLanguage(base, text, range, language)
                      rows.append(snapshot(selected, label: label, request: "selected", character: character, size: size))
                      rows.append(snapshot(CTFontCreateCopyWithAttributes(selected, size, nil, nil), label: label, request: "plain-copy", character: character, size: size))
                      rows.append(snapshot(scalerCopy(selected, size: size), label: label, request: "scaler-copy", character: character, size: size))
                  }
              }
          }
          let output = try JSONSerialization.data(withJSONObject: [
              "schema": "krr-macos-native-font-scaler-copy-diagnostic-v1",
              "rows": rows,
          ], options: [.sortedKeys])
          print(String(decoding: output, as: UTF8.self))
          SWIFT

      - name: Install Python analysis tools
        if: steps.source.outputs.font_metadata != 'true' && (steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true')
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Initialize fixed capacity reference before interaction Cargo
        if: steps.source.outputs.font_metadata != 'true' && (steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true')
        run: python3 scripts/build/initialize_ci_capacity_state.py --root "$PWD"

      - name: Verify real interaction state for measurement fixture
        if: steps.source.outputs.font_metadata != 'true' && (steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true')
        run: just browser-install html-interaction-check

      - name: Capture all 84 HTML catalog conditions
        if: steps.source.outputs.font_metadata != 'true' && (steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true')
        id: html84
        run: |
          output_root="tmp/html-performance-stage90/${{ github.run_id }}-${{ github.run_attempt }}"
          manifest="$output_root/captures/catalog-stage90-captures.json"
          diagnostic_conditions=()
          if [[ "${{ steps.source.outputs.diagnostic }}" == 'true' ]]; then
            diagnostic_conditions+=('decoration/translucent/960x720@1 events/expected-state/960x720@1')
          fi
          just html-performance-catalog-captures "$output_root" '' '' \
            "${{ steps.font_observer.outputs.executable }}" \
            031c93c5e822ffd8d22121bb41ed139fb6fcc4e96f6aa1f43ea31ec36fb9242c true "${diagnostic_conditions[@]}"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Test retained font proof with the captured native binary
        if: steps.source.outputs.diagnostic == 'true' && steps.source.outputs.font_metadata != 'true'
        run: |
          binary="tmp/html-performance-stage90/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/captures-binary/runtime-tests"
          python3 - "$binary" <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          import sys

          binary = Path(sys.argv[1]).resolve(strict=True)
          with binary.open("rb") as handle:
              digest = hashlib.file_digest(handle, "sha256").hexdigest()
          prefix = "markdown::chrome_font_identity_probe_tests::"
          cases = [
              "probe::observer_tests::unresolved_system_face_uses_a_verified_retained_observer_face",
              "probe::observer_tests::custom_faces_do_not_use_retained_observer_fallback",
              "probe::observer_tests::missing_retained_face_keeps_both_resolution_failures",
              "identity::observer_tests::retained_observer_face_requires_the_selected_physical_font",
              "identity::observer_tests::retained_observer_face_rejects_changed_or_wrong_face_proofs",
              "identity::observer_tests::retained_observer_face_requires_one_matching_proof",
              "test_support::observer_contract_tests::font_probe_rejects_duplicate_observer_font_identities",
              "identity::observer_tests::retained_observer_face_accepts_a_trace_proven_named_alias",
          ]
          catalog = subprocess.check_output([binary, "--list"], text=True).splitlines()
          for case in cases:
              name = prefix + case
              if catalog.count(f"{name}: test") != 1:
                  raise SystemExit(f"Expected one native regression case: {name}")
              result = subprocess.run([binary, "--exact", name], check=False, capture_output=True, text=True)
              if result.returncode or f"test {name} ... ok" not in result.stdout:
                  sys.stderr.write(result.stdout + result.stderr)
                  raise SystemExit(f"Native regression did not complete: {name}")
              print(f"{name}: passed")
          with binary.open("rb") as handle:
              if hashlib.file_digest(handle, "sha256").hexdigest() != digest:
                  raise SystemExit("Captured native test binary changed")
          PY

      - name: Measure all 84 catalog conditions against baseline
        if: steps.source.outputs.diagnostic != 'true' && (steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true')
        run: just html-performance-evidence-produce "${{ steps.html84.outputs.manifest }}"

      - name: Upload immutable source and run bound paired evidence
        if: steps.source.outputs.diagnostic != 'true' && (steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true')
        id: paired_performance_upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-performance-paired-${{ steps.source.outputs.head }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/html-performance-producer/bundle
          if-no-files-found: error
          retention-days: 14

      - name: Attest immutable paired performance artifact
        if: steps.source.outputs.diagnostic != 'true' && (steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: html-performance-paired-${{ steps.source.outputs.head }}-${{ github.run_id }}-${{ github.run_attempt }}
          subject-digest: sha256:${{ steps.paired_performance_upload.outputs.artifact-digest }}

      - name: Upload failed measurement diagnostics
        if: failure() && steps.source.outputs.diagnostic != 'true' && (steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-performance-diagnostics-${{ steps.source.outputs.head }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/html-performance-producer/*/*.json
            tmp/html-performance-producer/*/reports/*.json
          if-no-files-found: warn

  preflight:
    name: preflight
    needs: [test, paired-performance]
    if: >-
      needs.test.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Java runtime
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux runtime test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk graphviz libfontconfig-dev libfreetype-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-preflight-ubuntu-stable-all-features

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Install Python analysis tools
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@4ccefd7d26b61bbb81f4ff01165e8a6880a1bd59 # just

      - name: Install capacity cleanup tool
        run: cargo install cargo-sweep --version 0.8.0 --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.148

      - name: Acquire completed producer from this CI generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          KRR_HTML_PERFORMANCE_SCIPY_VERSION=1.18.1
          python3 scripts/release/run_html_performance.py --bootstrap verify --acquire-current-producer

      - name: Resolve version
        id: version
        shell: bash
        run: |
          bash scripts/release/resolve-release-version.sh \
            "${{ github.event_name }}" \
            "${{ inputs.version }}" \
            "${{ github.head_ref }}"

      - name: Release preflight checks
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: just VERSION="${{ steps.version.outputs.version }}" release-preflight-check
