          KRR_VERIFY_LINUX_ASSET_PREPARED: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' && inputs.verify_platform == 'linux-assets' && (inputs.verify_filter == 'full-runtime-assets' || inputs.verify_filter == 'remaining-runtime-assets') }}
