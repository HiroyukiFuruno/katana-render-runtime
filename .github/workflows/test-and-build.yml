name: CI

on:
  push:
    branches: [master]
    paths:
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "package.json"
      - "bun.lock"
      - "biome.json"
      - "tsconfig.json"
      - "moon.yml"
      - ".moon/**"
      - ".codex/**"
      - ".agents/**"
      - ".agent/**"
      - ".claude/**"
      - ".github/workflows/**"
      - "assets/**"
      - "README.md"
      - "docs/**"
      - "openspec/**"
      - "scripts/**"
      - "tests/**"
      - "crates/**"
      - "vendor/**"
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      verify_platform:
        description: Native platform for release/verify.
        required: false
        default: both
        type: choice
        options:
          - both
          - linux
          - linux-assets
          - linux-contracts
          - linux-fidelity
          - linux-observer-access
          - linux-root-coverage
          - linux-validation-contract
          - macos-stage90
          - windows
      verify_filter:
        description: Optional nextest filter, linux-assets test pattern, full-runtime-assets or remaining-runtime-assets, or linux-fidelity selection, or system-fonts for macos-stage90.
        required: false
        default: ''
        type: string
      verify_html_trace:
        description: Enable HTML phase timings in selected native test output. The requirements fixture emits its full timings even if it exceeds 60 seconds.
        required: false
        default: false
        type: boolean
      verify_html_optimized:
        description: Use the release build profile for the Windows HTML requirements timing.
        required: false
        default: false
        type: boolean

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' &&
    format('native-verify-{0}-{1}{2}{3}{4}', github.ref, inputs.verify_platform,
    inputs.verify_html_trace && '-html-trace' || '', inputs.verify_html_optimized && '-optimized' || '',
    inputs.verify_platform == 'linux-fidelity' && inputs.verify_filter != '' && format('-{0}', inputs.verify_filter) || '') ||
    format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  TEST_THREADS: "1"

jobs:
  verify-linux-root-coverage:
    name: Linux root coverage diagnostics
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' &&
      inputs.verify_platform == 'linux-root-coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d69a49c370bbebb2bbbd851a650df37fb6ba2f2a
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-v2-ubuntu-latest-stable-default
          save-if: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          enable-cache: false
      - uses: taiki-e/install-action@4ccefd7d26b61bbb81f4ff01165e8a6880a1bd59 # just
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.148
      - name: Prepare Linux root coverage environment
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "d69a49c370bbebb2bbbd851a650df37fb6ba2f2a"
          bun install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk graphviz libfontconfig-dev libfreetype-dev
          bunx playwright install --with-deps chrome chromium
          magick_dir="$RUNNER_TEMP/imagemagick"
          mkdir -p "$magick_dir/bin"
          cd "$magick_dir"
          curl --fail --location --retry 3 --output imagemagick.AppImage https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-33/ImageMagick-7.1.2-33-gcc-x86_64.AppImage
          printf '%s  %s\n' af598b07ab4dd8b8123623602dc9fc69d5e32185a36fd3739795a0deb02c1fb7 imagemagick.AppImage | sha256sum --check
          chmod +x imagemagick.AppImage
          ./imagemagick.AppImage --appimage-extract > /dev/null
          ln -s ../squashfs-root/AppRun bin/magick
          echo "$magick_dir/bin" >> "$GITHUB_PATH"
      - name: Prepare fixed coverage capacity and PlantUML
        run: |
          cargo install cargo-sweep --version 0.8.0 --locked
          python3 scripts/build/initialize_ci_capacity_state.py --root "$PWD"
          just plantuml-install
      - name: Run the exact Linux root coverage producer
        id: root_coverage
        timeout-minutes: 45
        run: just root-test-and-coverage
      - name: Verify collected Linux line totals
        env:
          PYTHONPATH: scripts/release
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          from native_coverage_result import _collected_line_totals, _line_totals, _tracked_rust_source_paths


          def show_incomplete_function_totals(approved, root, env, directory, collected):
              if not approved or any(any(char.isspace() for char in str(path)) for path in approved):
                  return
              env = {**env, "LLVM_COV_FLAGS": "--show-functions --sources " + " ".join(map(str, sorted(approved)))}
              report = Path(directory) / "functions.raw"
              errors = Path(directory) / "functions.stderr"
              command = ["cargo", "llvm-cov", "report", "--workspace", "--profile", "krr-coverage", "--locked"]
              with report.open("xb") as out, errors.open("xb") as err:
                  result = subprocess.run(command, cwd=root, env=env, stdout=out, stderr=err)
              print(f"LLVM function summary diagnostic exit: {result.returncode}")
              if result.returncode == 0:
                  anchors = approved_function_anchors(collected, approved, root)
                  for line in project_missing_function_totals(report, approved, root, anchors):
                      print(line)


          def approved_function_anchors(collected, approved, root):
              anchors = {}
              for mapping in collected["data"]:
                  for function in mapping.get("functions", []):
                      if not function["filenames"] or not function["regions"]:
                          continue
                      path = Path(os.path.normpath(root / function["filenames"][0]))
                      if path not in approved:
                          continue
                      position = function["regions"][0][:2]
                      anchors[(path.relative_to(root), function["name"])] = tuple(position)
              return anchors


          def project_missing_function_totals(report, approved, root, anchors):
              current = None
              with report.open(encoding="utf-8", errors="replace") as rows:
                  for row in rows:
                      header = re.fullmatch(r"File '(.+\.rs)':", row.strip())
                      if header:
                          path = Path(os.path.normpath(root / header[1]))
                          current = path.relative_to(root) if path in approved else None
                          continue
                      parts = row.split()
                      if current is None or len(parts) != 10 or not re.fullmatch(r"_R[A-Za-z0-9_.$]+", parts[0]):
                          continue
                      lines, missed = parts[4:6]
                      if not lines.isdecimal() or not missed.isdecimal() or not 0 <= int(missed) <= int(lines):
                          continue
                      location = ":".join(map(str, anchors.get((current, parts[0]), ())))
                      yield f"LLVM function lines {current}:{location} {parts[0]} {missed}/{lines} missed"


          path = Path("tmp/quality/standalone-performance-coverage/root.json")
          report = json.loads(path.read_bytes())
          totals = _collected_line_totals(report, "root")
          print(json.dumps(totals))
          root = Path.cwd().resolve()
          if totals["unmeasured"]:
              logs = tuple((path.parent / "root-nextest-attempts").glob("*/report/stdout.raw"))
              if len(logs) != 1:
                  raise ValueError("expected one report from this isolated root run")
              tracked = _tracked_rust_source_paths(root)
              for line in logs[0].read_text(encoding="utf-8").splitlines():
                  match = re.fullmatch(r"(.+\.rs): ([0-9,-]+(?: [0-9,-]+)*)", line)
                  if match:
                      source = Path(os.path.normpath(root / match[1]))
                      if source.is_relative_to(root) and source.relative_to(root) in tracked:
                          print(f"Uncovered {source.relative_to(root)}: {match[2]}")
              incomplete = {
                  Path(os.path.normpath(root / file["filename"]))
                  for mapping in report["data"]
                  for file in mapping["files"]
                  if file["summary"]["lines"]["count"] != file["summary"]["lines"]["covered"]
              }
              approved = {root / name for name in tracked} & incomplete
              with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as directory:
                  annotation = Path(directory) / "annotated.txt"
                  env = dict(os.environ)
                  env["CARGO_TARGET_DIR"] = str(root / "target")
                  env["CARGO_LLVM_COV_TARGET_DIR"] = str(root / "target/llvm-cov-target")
                  command = [
                      "cargo", "llvm-cov", "report", "--workspace", "--profile", "krr-coverage",
                      "--locked", "--text", "--show-instantiations", "--output-path", str(annotation),
                  ]
                  with (Path(directory) / "annotator.raw").open("xb") as diagnostic:
                      result = subprocess.run(command, cwd=root, env=env, stdout=diagnostic, stderr=subprocess.STDOUT)
                  print(f"LLVM annotated diagnostics exit: {result.returncode}")
                  if result.returncode == 0 and annotation.is_file():
                      current = root
                      seen = set()
                      with annotation.open(encoding="utf-8", errors="replace") as rows:
                          for row in rows:
                              header = re.fullmatch(r"([^|]+\.rs):", row.strip())
                              if header:
                                  current = Path(os.path.normpath(root / header[1]))
                                  continue
                              match = re.match(r"^\s*((?:\|\s*)*)(\d+)\|\s*0\|", row)
                              kind = "Unexecuted instantiation" if match and match[1] else "Uncovered annotated"
                              if match and current in approved and (current, match[2], kind) not in seen:
                                  seen.add((current, match[2], kind))
                                  print(f"{kind} {current.relative_to(root)}:{match[2]}")
                  show_incomplete_function_totals(approved, root, env, directory, report)
          _line_totals(report, "root", root)
          PY

  verify-linux-observer-access:
    name: Read-only HTML font observer access
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' &&
      inputs.verify_platform == 'linux-observer-access'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify pinned observer download from a read-only workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          observer_work="$(mktemp -d "$RUNNER_TEMP/krr-observer.XXXXXXXX")"
          trap 'rm -rf -- "$observer_work"' EXIT
          archive="$observer_work/observer.tar.gz"
          if ! gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/702068128" > "$archive"; then
            gh run download 44800513985 --repo "$GITHUB_REPOSITORY" \
              --name krr-font-observer-v0.4.24-92102a2d --dir "$observer_work/staged"
            mv "$observer_work/staged/font-observer-macos-arm64.tar.gz" "$archive"
          fi
          printf '%s  %s\n' 92102a2dad3ef4c5f50e5581c7f12a2c7b4e291ee3c3a2804299690811e8a86f "$archive" | sha256sum --check

  verify-linux-validation-contract:
    name: Linux owned validation contract
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' &&
      inputs.verify_platform == 'linux-validation-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (inputs.verify_filter == 'exact-322486da' || inputs.verify_filter == 'exact-322486da-producer') && '322486daa47d622827c2eb738030bdc539cbb111' || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
      - name: Install just for the shell recipe regression
        uses: taiki-e/install-action@4ccefd7d26b61bbb81f4ff01165e8a6880a1bd59 # just
      - name: Verify generated asset fingerprints and RTK recipes
        env:
          KRR_VALIDATION_MODE: ${{ inputs.verify_filter }}
          KRR_VALIDATION_HEAD: ${{ (inputs.verify_filter == 'exact-322486da' || inputs.verify_filter == 'exact-322486da-producer') && '322486daa47d622827c2eb738030bdc539cbb111' || github.sha }}
          MOON_CONCURRENCY: "1"
        run: |
          test "$(git rev-parse HEAD)" = "$KRR_VALIDATION_HEAD"
          bun install --frozen-lockfile
          uv venv --python 3.13 "$RUNNER_TEMP/krr-asset-python"
          uv pip sync --python "$RUNNER_TEMP/krr-asset-python/bin/python3" --require-hashes scripts/release/html-performance-requirements.lock
          export PATH="$RUNNER_TEMP/krr-asset-python/bin:$PATH"
          if [[ "$KRR_VALIDATION_MODE" == "exact-322486da-producer" ]]; then
            test_exit=0
            just runtime-unused-script-verify-run runtime-quality-owned-validation-contract || test_exit=$?
            if (( test_exit != 0 )); then
              python3 - <<'PY'
          import json, re
          from pathlib import Path
          raw = Path("tmp/quality/runtime-script-results/raw")
          for directory in sorted(raw.glob("*")):
              command = directory / "group-001-command.json"
              if not command.is_file():
                  continue
              argv = json.loads(command.read_bytes()).get("argv", [])
              if "./scripts/quality/owned-validation-contract_test.ts" not in argv:
                  continue
              for name in ("group-001-stderr.log", "group-001-stdout.log"):
                  stream = directory / name
                  if not stream.is_file():
                      continue
                  summary = []
                  for raw_line in stream.read_text(errors="replace").splitlines():
                      line = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", raw_line)
                      if re.match(r"^\s*(?:\((?:fail|timeout)\)|(?:[0-9]+ fail|[0-9]+ pass)\b|error: expect\(|at .*owned-validation-contract_test\.ts:)", line):
                          summary.append(line[:240])
                  for line in summary[-30:]:
                      print(line)
          PY
            fi
            exit "$test_exit"
          elif [[ "$KRR_VALIDATION_MODE" == "exact-322486da" ]]; then
            bun test --path-ignore-patterns 'tmp/**' ./scripts/quality/owned-validation-contract_test.ts
          else
            bun test --path-ignore-patterns 'tmp/**' ./scripts/quality/owned-validation-contract_test.ts -t 'generated Rust fingerprint binds added paths and restores after removal|Just RTK proxy prefixes render correctly'
          fi

  verify-linux-contracts:
    name: Linux automation contracts
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' &&
      inputs.verify_platform == 'linux-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.verify_filter == 'release-contracts' && '33e1938cdb7b8da9ebc93dcadea1ed1e98a29ec6' || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt, llvm-tools-preview
      - name: Verify guarded Cargo clean contracts
        if: inputs.verify_filter != 'release-contracts'
        run: python3 -m unittest discover -s scripts/hooks -p run_locked_command_test.py --failfast
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: inputs.verify_filter == 'release-contracts'
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: inputs.verify_filter == 'release-contracts'
        with:
          version: "0.13.0"
          enable-cache: true
      - uses: taiki-e/install-action@4ccefd7d26b61bbb81f4ff01165e8a6880a1bd59 # just
        if: inputs.verify_filter == 'release-contracts'
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        if: inputs.verify_filter == 'release-contracts'
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        if: inputs.verify_filter == 'release-contracts'
        with:
          tool: cargo-nextest@0.9.148
      - name: Verify full automation contracts at release HEAD
        id: release_contracts
        if: inputs.verify_filter == 'release-contracts'
        shell: bash
        env:
          PR_HEAD_SHA: 33e1938cdb7b8da9ebc93dcadea1ed1e98a29ec6
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          bun install --frozen-lockfile
          cargo install cargo-sweep --version 0.8.0 --locked
          source scripts/release/check-linux-contracts.sh
          just check-contracts
      - name: Collect failing contract cases from every suite
        if: failure() && steps.release_contracts.outcome == 'failure'
        env:
          PR_HEAD_SHA: 33e1938cdb7b8da9ebc93dcadea1ed1e98a29ec6
        run: bash scripts/release/check-linux-contracts.sh --collect-failures

  static-quality:
    name: Source quality checks
    if: >-
      !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Install Python analysis tools
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install just
        uses: taiki-e/install-action@4ccefd7d26b61bbb81f4ff01165e8a6880a1bd59 # just
      - name: Install ShellCheck 0.11.0
        run: |
          curl --fail --location --output "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --version | grep -Fx 'version: 0.11.0'
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Verify validation registration before scheduling checks
        run: bun scripts/html/harness-contract-cli.ts
      - name: Run independent source checks
        env:
          MOON_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: bun run moon --concurrency 3 exec krr:source-static --on-failure continue --no-actions

  test:
    name: Test and Build
    needs: static-quality
    if: >-
      (success() || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' &&
      needs.static-quality.result == 'skipped')) &&
      (!(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify') ||
      contains(fromJSON('["both","linux","linux-assets","linux-fidelity","windows"]'), inputs.verify_platform)) &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/verify' && (startsWith(inputs.verify_platform, 'linux') && '{"include":[{"os":"ubuntu-latest","platform":"linux64"}]}' || inputs.verify_platform == 'windows' && '{"include":[{"os":"windows-latest","platform":"win64"}]}' || '{"include":[{"os":"ubuntu-latest","platform":"linux64"},{"os":"windows-latest","platform":"win64"}]}') || '{"include":[{"os":"ubuntu-latest","platform":"linux64"},{"os":"macos-15","platform":"mac-arm64"},{"os":"windows-latest","platform":"win64"}]}') }}
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      attestations: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Prepare Windows Git checkout
        if: matrix.os == 'windows-latest'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify optional local macOS evidence
        id: mac_proof
        if: matrix.platform == 'mac-arm64' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/release/local_macos_evidence.py --verify
          --repo "${{ github.repository }}"
          --pr "${{ github.event.pull_request.number }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Report reused local macOS evidence
        if: matrix.platform == 'mac-arm64' && steps.mac_proof.outcome == 'success' && steps.mac_proof.outputs.reuse == 'true'
        run: echo 'macOS Apple Silicon checks reused from verified maintainer evidence.'

      - name: Install Java runtime
        if: (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust toolchain
        if: (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Cargo 1.100 の中間成果物配置に容量管理が対応するまでは互換版を使う。
