name: CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  TEST_THREADS: "1"

jobs:
  validation_scope:
    name: Validation scope
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master')
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify validation scope
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          scope=full
          if [[ "$EVENT_NAME" == 'pull_request' && "$PR_HEAD_REPOSITORY" == "$REPOSITORY" && "$PR_HEAD_REF" == release/ci-* ]]; then
            scope="$(python3 scripts/hooks/validation_scope.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA")"
          fi
          test "$scope" = automation || test "$scope" = full
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

  static-quality:
    name: ${{ needs.validation_scope.outputs.scope == 'full' && 'Source quality checks' || 'Full source checks skipped' }}
    needs: validation_scope
    if: >-
      needs.validation_scope.outputs.scope == 'full' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Install Python analysis tools
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install just
        uses: taiki-e/install-action@4ccefd7d26b61bbb81f4ff01165e8a6880a1bd59 # just
      - name: Install ShellCheck 0.11.0
        run: |
          curl --fail --location --output "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --version | grep -Fx 'version: 0.11.0'
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Verify validation registration before scheduling checks
        run: bun scripts/html/harness-contract-cli.ts
      - name: Run independent source checks
        env:
          MOON_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: bun run moon --concurrency 3 exec krr:source-static --on-failure continue --no-actions

  test:
    name: ${{ needs.validation_scope.outputs.scope == 'full' && format('Test and Build ({0})', matrix.check_name) || format('Full checks skipped ({0})', matrix.check_name) }}
    needs: [validation_scope, static-quality]
    if: >-
      needs.validation_scope.outputs.scope == 'full' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux64
            check_name: ubuntu-latest, linux64
          - os: macos-latest
            platform: mac-arm64
            check_name: mac-arm64
          - os: windows-latest
            platform: win64
            check_name: windows-latest, win64
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      attestations: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Prepare Windows Git checkout
        if: matrix.os == 'windows-latest'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify optional local macOS evidence
        id: mac_proof
        if: matrix.platform == 'mac-arm64' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/release/local_macos_evidence.py --verify
          --repo "${{ github.repository }}"
          --pr "${{ github.event.pull_request.number }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Report reused local macOS evidence
        if: matrix.platform == 'mac-arm64' && steps.mac_proof.outcome == 'success' && steps.mac_proof.outputs.reuse == 'true'
        run: echo 'macOS Apple Silicon checks reused from verified maintainer evidence.'

      - name: Install Java runtime
        if: (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust toolchain
        if: (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Cargo 1.100 の中間成果物配置に容量管理が対応するまでは互換版を使う。
          toolchain: "1.99.1"
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache Rust build outputs
        if: (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-v2-${{ matrix.os }}-stable-default

      - name: Install Bun
        if: matrix.os != 'windows-latest'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install JavaScript dependencies
        if: matrix.os != 'windows-latest'
        run: bun install --frozen-lockfile

      - name: Install Python analysis tools
        if: matrix.os == 'ubuntu-latest' || (matrix.platform == 'mac-arm64' && (steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true'))
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Install cargo-nextest
        if: (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.148

      - name: Install ShellCheck 0.11.0 on macOS
        if: matrix.platform == 'mac-arm64' && (steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --location --retry 3 --output "$archive" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.darwin.aarch64.tar.xz
          printf '%s  %s\n' 56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79 "$archive" | shasum -a 256 --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --version | grep -Fx 'version: 0.11.0'
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"

      - name: Install just
        uses: taiki-e/install-action@4ccefd7d26b61bbb81f4ff01165e8a6880a1bd59 # just

      - name: Install Chrome for the macOS official producer browser test
        if: matrix.platform == 'mac-arm64'
        run: bunx playwright install chrome chromium

      - name: Install capacity cleanup tool
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-sweep --version 0.8.0 --locked

      - name: Run automation contract tests
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          source scripts/release/check-linux-contracts.sh
          just check-contracts

      - name: Check formatting
        if: matrix.os != 'windows-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: just fmt-check

      - name: Run Windows format check
        if: matrix.os == 'windows-latest'
        run: just fmt-check

      # 正常なUbuntu Rustキャッシュを使い、V8 archive欠落時だけ描画ランタイムを再生成する。
      - name: Repair cached V8 archive on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          for target_dir in target target/llvm-cov-target; do
            if [ ! -s "$target_dir/debug/gn_out/obj/librusty_v8.a" ]; then
              cargo clean --target-dir "$target_dir" -p katana-render-runtime
            fi
          done

      - name: Initialize fixed capacity reference
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/build/initialize_ci_capacity_state.py --root "$PWD"

      - name: Check Rust types
        if: (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: cargo check --workspace --locked

      - name: Run linter
        if: matrix.os != 'windows-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: just lint

      - name: Run AST linter
        if: matrix.os != 'windows-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: just ast-lint

      - name: Check dependency boundary
        if: matrix.os != 'windows-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: just dependency-leak

      - name: Install ImageMagick for the macOS browser test
        if: matrix.platform == 'mac-arm64'
        run: brew install imagemagick

      - name: Run macOS official producer browser test
        if: matrix.platform == 'mac-arm64'
        run: just macos-browser-contract-test

      # rust-cache は target を復元しても rusty_v8 の静的アーカイブを復元しない場合がある。
      # macOS のリンク実行前に描画ランタイムを再構築し、公式アーカイブの取得とリンクを保証する。
      - name: Rebuild V8 static archive on macOS arm64
        if: startsWith(matrix.platform, 'mac-') && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: |
          cargo clean -p katana-render-runtime
          cargo build -p katana-render-runtime-cli --locked

      - name: Rebuild V8 static archive on Windows
        if: matrix.platform == 'win64'
        shell: pwsh
        run: |
          cargo clean -p katana-render-runtime
          cargo build -p katana-render-runtime-cli --locked






      - name: Check runtime bundle sync
        if: matrix.os != 'windows-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: just runtime-bundle-check

      - name: Install Linux runtime test prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk graphviz libfontconfig-dev libfreetype-dev

      - name: Install Graphviz for PlantUML on macOS
        if: matrix.platform == 'mac-arm64' && (steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: brew install graphviz

      - name: Install PlantUML runtime
        if: (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: just plantuml-install

      - name: Run tests
        if: matrix.os != 'ubuntu-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        timeout-minutes: 45
        run: just unit-test

      - name: Run PlantUML smoke check
        if: matrix.os != 'windows-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: |
          cargo run -p katana-render-runtime-cli -- plantuml render --input tests/fixtures/plantuml/representative/01-sequence.puml --output "$RUNNER_TEMP/plantuml-sequence.svg"
          grep -q '<svg' "$RUNNER_TEMP/plantuml-sequence.svg"

      - name: Run PlantUML smoke check on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "plantuml-sequence.svg"
          cargo run -p katana-render-runtime-cli -- plantuml render --input tests/fixtures/plantuml/representative/01-sequence.puml --output $output
          if (-not (Select-String -Path $output -Pattern "<svg" -Quiet)) {
            throw "PlantUML smoke output did not contain SVG"
          }


      - name: Check TypeScript formatting and lint
        if: matrix.os != 'windows-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: just biome

      - name: Check TypeScript types
        if: matrix.os != 'windows-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: just typecheck

      - name: Check runtime asset checksums
        if: matrix.os != 'windows-latest' && (matrix.platform != 'mac-arm64' || steps.mac_proof.outcome != 'success' || steps.mac_proof.outputs.reuse != 'true')
        run: just runtime-asset-check

      - name: Check packaged runtime bundles
        if: matrix.os == 'ubuntu-latest'
        run: just runtime-bundle-package-check

      - name: Check packaged PlantUML runtime manifest
        if: matrix.os == 'ubuntu-latest'
        run: just plantuml-runtime-package-check

      - name: Install Google Chrome for independent HTML reference
        if: matrix.os == 'ubuntu-latest'
        run: bunx playwright install --with-deps chrome chromium

      - name: Install pinned ImageMagick for HTML comparison
        if: matrix.os == 'ubuntu-latest'
        env:
          IMAGEMAGICK_DIR: ${{ runner.temp }}/imagemagick
        run: |
          mkdir -p "$IMAGEMAGICK_DIR"
          cd "$IMAGEMAGICK_DIR"
          curl --fail --location --retry 3 --output imagemagick.AppImage https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-33/ImageMagick-7.1.2-33-gcc-x86_64.AppImage
          printf '%s  %s\n' af598b07ab4dd8b8123623602dc9fc69d5e32185a36fd3739795a0deb02c1fb7 imagemagick.AppImage | sha256sum --check
          chmod +x imagemagick.AppImage
          ./imagemagick.AppImage --appimage-extract > /dev/null
          mkdir -p bin
          ln -s ../squashfs-root/AppRun bin/magick
          echo "$IMAGEMAGICK_DIR/bin" >> "$GITHUB_PATH"
          bin/magick -version

      - name: Run runtime asset script tests
        if: matrix.os == 'ubuntu-latest'
        env:
          MOON_CONCURRENCY: "2"
        # Linuxでの実測に合わせて準備と検査全体の時間を確保し、個別の期限は既存テストで判定する。
        timeout-minutes: 35
        run: |
          asset_python="$RUNNER_TEMP/krr-asset-python"
          uv venv --python 3.13 "$asset_python"
          uv pip sync --python "$asset_python/bin/python3" --require-hashes scripts/release/html-performance-requirements.lock
          export PATH="$asset_python/bin:$PATH"
          just runtime-asset-script-test

      - name: Select authorized HTML release phase
        id: html_policy
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 scripts/release/html_fidelity_policy.py > "$RUNNER_TEMP/html-fidelity-policy.json"
          python3 - <<'PY_PHASE'
          import json, os
          from pathlib import Path
          policy = json.loads((Path(os.environ["RUNNER_TEMP"]) / "html-fidelity-policy.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"phase={policy['phase']}\n")
          PY_PHASE

      - name: Build Linux HTML comparison probes
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: |
          just html-fidelity-probe-build
          just --command cargo test --release -p katana-render-runtime --lib --no-run --locked

      - name: Compare HTML against Google Chrome for authorized release phase
        if: matrix.os == 'ubuntu-latest'
        # 全画像・操作・集計までの既存一括検証は実測で約28分かかった。
        timeout-minutes: 35
        run: just html-release-fidelity-check

      - name: Compare HTML interactions against Google Chrome
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: just html-interaction-check

      - name: Upload independent HTML comparison evidence
        if: matrix.os == 'ubuntu-latest' && steps.html_policy.outputs.phase == 'final' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-chrome-fidelity
          path: tmp/html-chrome-fidelity-suite
          if-no-files-found: error

      - name: Upload interim HTML comparison evidence
        if: matrix.os == 'ubuntu-latest' && steps.html_policy.outputs.phase == 'interim' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-chrome-fidelity-interim-v0.4.24
          path: |
            tmp/html-fidelity/interim
            tmp/html-fidelity/dynamic-interim
            tmp/html-fidelity/input-state-interim
          retention-days: 14
          if-no-files-found: error

      - name: Upload HTML interaction evidence
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-chrome-interactions
          path: tmp/html-interaction-suite
          if-no-files-found: error

      - name: Run Windows review process tree tests
        if: matrix.os == 'windows-latest'
        timeout-minutes: 5
        run: python -m unittest discover -s scripts/hooks -p local_review_windows_job_test.py -v

      - name: Run runtime package asset check
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: just runtime-package-asset-check

      - name: Record Ubuntu build disk usage before coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          df -h .
          du -sh target 2>/dev/null || true

      - name: Run coverage
        id: coverage
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 45
        run: just coverage

      - name: Diagnose coverage failure
        if: matrix.os == 'ubuntu-latest' && (failure() || cancelled())
        shell: bash
        run: |
          set +e
          echo 'Coverage diagnostic: disk usage'
          df -h
          echo 'Coverage diagnostic: process table'
          ps -eo pid,ppid,stat,etime,cmd --sort=-etime | head -80
          echo 'Coverage diagnostic: llvm-cov summary'
          cargo llvm-cov report --summary-only
          cargo llvm-cov report --show-missing-lines

      - name: Record Ubuntu build disk usage after coverage
        if: matrix.os == 'ubuntu-latest' && always()
        run: |
          df -h .
          du -sh target 2>/dev/null || true

      - name: Record immutable PR base evidence
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && success()
        env:
          CI_EVIDENCE_PATH: ${{ runner.temp }}/ci-quality-evidence.json
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from scripts.release.html_fidelity_policy import assert_head_source_binding, select_html_policy, workspace_version
          from pathlib import Path

          assert_head_source_binding(os.environ["PR_HEAD_SHA"])
          selection = select_html_policy(workspace_version(), os.environ["GITHUB_HEAD_REF"])
          payload = {
              "schema": 2,
              "html_fidelity": selection,
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "base_sha": os.environ["PR_BASE_SHA"],
              "head_sha": os.environ["PR_HEAD_SHA"],
          }
          Path(os.environ["CI_EVIDENCE_PATH"]).write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")), encoding="utf-8"
          )
          PY

      - name: Upload immutable PR base evidence
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-quality-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-quality-evidence.json
          if-no-files-found: error
          retention-days: 7

  scoped-static-quality:
    name: ${{ needs.validation_scope.outputs.scope == 'automation' && 'Source quality checks' || 'Scoped source checks skipped' }}
    needs: validation_scope
    if: >-
      needs.validation_scope.outputs.scope == 'automation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Python analysis tools
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install just
        uses: taiki-e/install-action@4ccefd7d26b61bbb81f4ff01165e8a6880a1bd59 # just
      - name: Run scoped workflow contract validation
        run: bash scripts/hooks/check_automation_changes.sh

  scoped-test:
    name: ${{ needs.validation_scope.outputs.scope == 'automation' && format('Test and Build ({0})', matrix.check_name) || format('Scoped checks skipped ({0})', matrix.check_name) }}
    needs: [validation_scope, scoped-static-quality]
    if: >-
      needs.validation_scope.outputs.scope == 'automation'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            check_name: ubuntu-latest, linux64
            python: python3
          - os: macos-latest
            check_name: mac-arm64
            python: python3
          - os: windows-latest
            check_name: windows-latest, win64
            python: python
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long paths for scoped Windows checkout
        if: matrix.os == 'windows-latest'
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify scoped source identity and metadata
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHON: ${{ matrix.python }}
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$("$PYTHON" scripts/hooks/validation_scope.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA")" = automation
          git diff --check "$PR_BASE_SHA" "$PR_HEAD_SHA"

  scoped-preflight:
    name: ${{ needs.validation_scope.outputs.scope == 'automation' && 'preflight' || 'Scoped preflight skipped' }}
    needs: [validation_scope, scoped-test]
    if: >-
      needs.validation_scope.outputs.scope == 'automation' &&
      needs.scoped-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify scoped preflight source identity
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$(python3 scripts/hooks/validation_scope.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA")" = automation
          git diff --check "$PR_BASE_SHA" "$PR_HEAD_SHA"

  paired-performance:
    name: Native paired HTML time and RSS nonregression
    needs: [validation_scope, test]
    if: >-
      needs.validation_scope.outputs.scope == 'full' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'))
    runs-on: macos-latest
    timeout-minutes: 360
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    steps:
      - name: Checkout exact measurement source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record actual source HEAD
        id: source
        run: |
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 -c 'import tomllib; print("version=" + tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])' >> "$GITHUB_OUTPUT"

      - name: Verify optional local HTML performance evidence
        id: html_local_proof
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          evidence_args=()
          if [[ "${{ steps.source.outputs.version }}" == '0.4.24' ]]; then
            evidence_args+=(--visual)
          fi
          python3 scripts/release/local_html_performance_evidence.py --repository "$GITHUB_REPOSITORY"             "${evidence_args[@]}" --verify --pr "$PR_NUMBER" --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"

      - name: Report local HTML performance evidence
        if: steps.html_local_proof.outcome == 'success' && steps.html_local_proof.outputs.reuse == 'true'
        run: |
          if [[ "${{ steps.source.outputs.version }}" == '0.4.24' ]]; then
            echo 'HTML visual evidence reused from verified maintainer evidence.'
          else
            echo 'HTML performance reused from verified maintainer evidence.'
          fi

      - name: Install Rust toolchain
        if: steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"

      - name: Install just
        if: steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true'
        uses: taiki-e/install-action@4ccefd7d26b61bbb81f4ff01165e8a6880a1bd59 # just

      - name: Install Bun
        if: steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install JavaScript dependencies
        if: steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true'
        run: bun install --frozen-lockfile

      - name: Set up Python 3.13
        if: steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Download and verify font observer
        id: font_observer
        if: steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          observer_work="$(mktemp -d "${RUNNER_TEMP}/krr-font-observer.XXXXXXXX")"
          observer_work="$(python3 -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$observer_work")"
          archive="$observer_work/observer.tar.gz"
          # 公開前は固定CI成果物から同一のアーカイブを取得できる。
          if ! gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/702068128" > "$archive"; then
            gh run download 44800513985 --repo "$GITHUB_REPOSITORY" \
              --name krr-font-observer-v0.4.24-92102a2d --dir "$observer_work/staged"
            mv "$observer_work/staged/font-observer-macos-arm64.tar.gz" "$archive"
          fi
          python3 scripts/release/html_performance_observer_unpack.py \
            --archive "$archive" \
            --archive-sha256 92102a2dad3ef4c5f50e5581c7f12a2c7b4e291ee3c3a2804299690811e8a86f \
            --manifest-sha256 74594a04e993c89f969d6b02c42a84fe4a787d818a0bd339d7d96445380ba6dc \
            --executable-sha256 031c93c5e822ffd8d22121bb41ed139fb6fcc4e96f6aa1f43ea31ec36fb9242c \
            --output-dir "$observer_work/observer"
          echo "executable=$observer_work/observer/headless_shell" >> "$GITHUB_OUTPUT"

      - name: Install Python analysis tools
        if: steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Initialize fixed capacity reference before interaction Cargo
        if: steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true'
        run: python3 scripts/build/initialize_ci_capacity_state.py --root "$PWD"

      - name: Verify real interaction state for measurement fixture
        if: steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true'
        run: just browser-install html-interaction-check

      - name: Capture all 84 HTML catalog conditions
        if: steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true'
        id: html84
        run: |
          output_root="tmp/html-performance-stage90/${{ github.run_id }}-${{ github.run_attempt }}"
          manifest="$output_root/captures/catalog-stage90-captures.json"
          just html-performance-catalog-captures "$output_root" '' '' \
            "${{ steps.font_observer.outputs.executable }}" \
            031c93c5e822ffd8d22121bb41ed139fb6fcc4e96f6aa1f43ea31ec36fb9242c true
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Verify all 84 HTML images and font identities for v0.4.24
        if: steps.source.outputs.version == '0.4.24' && (steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true')
        env:
          CAPTURE_MANIFEST: ${{ steps.html84.outputs.manifest }}
        run: |
          output_root="$(dirname "$(dirname "$CAPTURE_MANIFEST")")"
          report="$output_root/visual-acceptance.json"
          bun scripts/html/fidelity-acceptance-cli.ts catalog-stage90-validate-captures "$CAPTURE_MANIFEST" "$output_root/plan.json" > "$report"
          python3 -c 'import json, sys; r=json.load(open(sys.argv[1])); sys.exit(0 if r["acceptance"] is True and r["fontIdentityEquivalence"] == "established" and len(r["conditions"]) == 84 else "HTML visual or font acceptance failed")' "$report"

      - name: Measure all 84 catalog conditions against baseline
        if: steps.source.outputs.version != '0.4.24' && (steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true')
        run: just html-performance-evidence-produce "${{ steps.html84.outputs.manifest }}"

      - name: Upload immutable source and run bound paired evidence
        if: steps.source.outputs.version != '0.4.24' && (steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true')
        id: paired_performance_upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-performance-paired-${{ steps.source.outputs.head }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/html-performance-producer/bundle
          if-no-files-found: error
          retention-days: 14

      - name: Attest immutable paired performance artifact
        if: steps.source.outputs.version != '0.4.24' && (steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: html-performance-paired-${{ steps.source.outputs.head }}-${{ github.run_id }}-${{ github.run_attempt }}
          subject-digest: sha256:${{ steps.paired_performance_upload.outputs.artifact-digest }}

      - name: Upload failed measurement diagnostics
        if: failure() && (steps.html_local_proof.outcome != 'success' || steps.html_local_proof.outputs.reuse != 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-performance-diagnostics-${{ steps.source.outputs.head }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/html-performance-producer/*/*.json
            tmp/html-performance-producer/*/reports/*.json
          if-no-files-found: warn

  preflight:
    name: ${{ needs.validation_scope.outputs.scope == 'full' && 'preflight' || 'Full preflight skipped' }}
    needs: [validation_scope, test, paired-performance]
    if: >-
      needs.validation_scope.outputs.scope == 'full' &&
      needs.test.result == 'success' &&
      needs.paired-performance.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify unchanged version for non-release PR
        if: "!startsWith(github.head_ref, 'release/v')"
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git diff --check "$PR_BASE_SHA" "$PR_HEAD_SHA"
          version() {
            git show "$1:Cargo.toml" | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])'
          }
          base_version="$(version "$PR_BASE_SHA")"
          head_version="$(version "$PR_HEAD_SHA")"
          test "$base_version" = "$head_version"

      - name: Install Java runtime
        if: startsWith(github.head_ref, 'release/v')
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux runtime test prerequisites
        if: startsWith(github.head_ref, 'release/v')
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk graphviz libfontconfig-dev libfreetype-dev

      - name: Install Rust
        if: startsWith(github.head_ref, 'release/v')
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo
        if: startsWith(github.head_ref, 'release/v')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-preflight-ubuntu-stable-all-features

      - name: Install Bun
        if: startsWith(github.head_ref, 'release/v')
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install JavaScript dependencies
        if: startsWith(github.head_ref, 'release/v')
        run: bun install --frozen-lockfile

      - name: Install Python analysis tools
        if: startsWith(github.head_ref, 'release/v')
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install just
        if: startsWith(github.head_ref, 'release/v')
        uses: taiki-e/install-action@4ccefd7d26b61bbb81f4ff01165e8a6880a1bd59 # just

      - name: Install capacity cleanup tool
        if: startsWith(github.head_ref, 'release/v')
        run: cargo install cargo-sweep --version 0.8.0 --locked

      - name: Install cargo-llvm-cov
        if: startsWith(github.head_ref, 'release/v')
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Install cargo-nextest
        if: startsWith(github.head_ref, 'release/v')
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.148

      - name: Resolve version
        if: startsWith(github.head_ref, 'release/v')
        id: version
        shell: bash
        run: |
          bash scripts/release/resolve-release-version.sh \
            "$GITHUB_EVENT_NAME" "" "$GITHUB_HEAD_REF"

      - name: Acquire completed producer from this CI generation
        if: startsWith(github.head_ref, 'release/v') && steps.version.outputs.version != 'v0.4.24'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          KRR_HTML_PERFORMANCE_SCIPY_VERSION=1.18.1
          python3 scripts/release/run_html_performance.py --bootstrap verify --acquire-current-producer

      - name: Release preflight checks
        if: startsWith(github.head_ref, 'release/v')
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: just VERSION="${{ steps.version.outputs.version }}" release-preflight-check
