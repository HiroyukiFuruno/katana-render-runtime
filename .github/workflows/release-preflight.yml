name: release-preflight

on:
  pull_request:
    branches: [master]
    paths:
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "package.json"
      - "bun.lock"
      - "biome.json"
      - "tsconfig.json"
      - ".github/workflows/**"
      - "assets/**"
      - "README.md"
      - "docs/**"
      - "openspec/**"
      - "scripts/**"
      - "tests/**"
      - "crates/**"
      - "vendor/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0. Defaults to Cargo.toml version."
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  TEST_THREADS: "1"

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Skip non-release pull request
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/v')
        run: echo "release-preflight is skipped for non-release pull requests."

      - name: Checkout
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Java runtime
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux runtime test prerequisites
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk graphviz

      - name: Install Rust
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: release-preflight-ubuntu-stable-all-features

      - name: Install Bun
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JavaScript dependencies
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        run: bun install --frozen-lockfile

      - name: Install just
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: taiki-e/install-action@just

      - name: Install cargo-llvm-cov
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Resolve version
        id: version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        shell: bash
        run: |
          bash scripts/release/resolve-release-version.sh \
            "${{ github.event_name }}" \
            "${{ inputs.version }}" \
            "${{ github.head_ref }}"

      # This is deliberately loaded from master, rather than the release PR.
      # A release PR may change its own evidence policy but cannot make that
      # policy trusted for skipping the quality gate it changes.
      - name: Load trusted CI evidence consumer
        id: evidence_loader
        if: startsWith(github.head_ref, 'release/v')
        shell: bash
        run: |
          set -euo pipefail
          trusted_directory="$RUNNER_TEMP/krr-ci-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$trusted_directory"
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          trusted_source="$(git rev-parse --verify origin/master^{commit})"
          for source in consume.py schema.py tree_digest.py; do
            git cat-file -e "$trusted_source:scripts/ci_evidence/$source"
            git show "$trusted_source:scripts/ci_evidence/$source" >"$trusted_directory/$source"
          done
          chmod 500 "$trusted_directory/consume.py"
          echo "directory=$trusted_directory" >> "$GITHUB_OUTPUT"
          echo "source=$trusted_source" >> "$GITHUB_OUTPUT"

      - name: Check trusted Linux CI evidence
        id: reusable_quality
        timeout-minutes: 110
        if: startsWith(github.head_ref, 'release/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence_file="$RUNNER_TEMP/krr-ci-evidence.json"
          poll_attempt=0
          poll_max_attempts=120
          poll_interval_seconds=45

          while (( poll_attempt < poll_max_attempts )); do
            poll_attempt=$((poll_attempt + 1))
            set +e
            python3 "${{ steps.evidence_loader.outputs.directory }}/consume.py" \
              --repository "${{ github.repository }}" \
              --pr-number "${{ github.event.pull_request.number }}" \
              --head-sha "${{ github.event.pull_request.head.sha }}" \
              --head-ref "${{ github.event.pull_request.head.ref }}" \
              --profile linux-release-quality-v1 \
              --output "$evidence_file"
            status=$?
            set -e
            case "$status" in
              0)
                test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["decision"])' "$evidence_file")" = reuse
                echo "reuse=true" >> "$GITHUB_OUTPUT"
                echo "Reusing trusted Linux quality evidence from master-loaded consumer ${{ steps.evidence_loader.outputs.source }} after $poll_attempt poll(s)."
                cat "$evidence_file"
                exit 0
                ;;
              10)
                test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["decision"])' "$evidence_file")" = rerun
                if (( poll_attempt == poll_max_attempts )); then
                  echo "No unique matching trusted evidence after $poll_attempt bounded poll(s); running the complete Linux quality gate."
                  echo "reuse=false" >> "$GITHUB_OUTPUT"
                  cat "$evidence_file"
                  exit 0
                fi
                echo "Trusted evidence is not ready (poll $poll_attempt/$poll_max_attempts); retrying in ${poll_interval_seconds}s."
                sleep "$poll_interval_seconds"
                ;;
              *)
                echo "Trusted evidence consumer failed (exit $status); refusing to silently skip the quality gate." >&2
                exit "$status"
                ;;
            esac
          done

          echo "Evidence polling exhausted without a decision; refusing to silently skip the quality gate." >&2
          exit 1

      - name: Run shared release quality gate
        if: github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'release/v') && steps.reusable_quality.outputs.reuse != 'true')
        timeout-minutes: 75
        run: just release-quality

      - name: Release-specific verification
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: just VERSION="${{ steps.version.outputs.version }}" release-specific
