name: release-preflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0. Defaults to Cargo.toml version."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  TEST_THREADS: "1"

jobs:
  preflight:
    name: preflight
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 手動検証は既に完了したCIの証跡だけを使い、計測待機を行わない。
    timeout-minutes: 360
    steps:
      - name: Checkout
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Java runtime
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux runtime test prerequisites
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk graphviz

      - name: Install Rust
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-preflight-ubuntu-stable-all-features

      - name: Install Bun
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install JavaScript dependencies
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        run: bun install --frozen-lockfile

      - name: Install Python analysis tools
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install just
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: taiki-e/install-action@4ccefd7d26b61bbb81f4ff01165e8a6880a1bd59 # just

      - name: Install capacity cleanup tool
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        run: cargo install cargo-sweep --version 0.8.0 --locked

      - name: Install cargo-llvm-cov
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: taiki-e/install-action@c2e5d2ce8920c881761c4cabb41434daa1f95687 # cargo-llvm-cov

      - name: Install cargo-nextest
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.148

      - name: Acquire completed exact-source CI and paired performance evidence
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: just html-performance-evidence-acquire

      - name: Resolve version
        id: version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        shell: bash
        run: |
          bash scripts/release/resolve-release-version.sh \
            "${{ github.event_name }}" \
            "${{ inputs.version }}" \
            "${{ github.head_ref }}"

      - name: Release check
        if: github.event_name == 'workflow_dispatch'
        # release-quality は最大65分、release-specific は最大35分を要するため、
        # 手動リリース検証は両者を直列に完了できる100分を下限にする。
        timeout-minutes: 100
        env:
          GH_TOKEN: ${{ github.token }}
        run: just VERSION="${{ steps.version.outputs.version }}" release-check
