                          payload = stream.read(MAX_BYTES + 1)
                      _require(len(payload) == entry.file_size and len(payload) <= MAX_BYTES, "Artifact expansion exceeds its bound")
                      return payload
              except (zipfile.BadZipFile, OSError, RuntimeError, ValueError) as error:
                  if isinstance(error, CohortError):
                      raise
                  raise CohortError("Invalid artifact archive") from error

          def read_artifact_archive(endpoint, token, timeout, open_request=None):
              _require(isinstance(endpoint, str) and re.fullmatch(r"repos/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/actions/artifacts/[1-9][0-9]*/zip", endpoint),
                       "Noncanonical artifact API endpoint")
              open_request = open_request or _open_no_redirect
              request = urllib.request.Request("https://api.github.com/" + endpoint,
                                               headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                                                        "X-GitHub-Api-Version": "2022-11-28"})
              try:
                  response = open_request(request, timeout)
              except (OSError, urllib.error.URLError) as error:
                  raise CohortError("Artifact API request failed") from None
              _require(response.code == 302, "Artifact API did not return a signed archive redirect")
              location = response.headers.get("Location")
              parsed = urllib.parse.urlsplit(location) if isinstance(location, str) else None
              _require(parsed is not None and parsed.scheme == "https" and parsed.hostname
                       and (parsed.hostname.endswith(".blob.core.windows.net") or parsed.hostname.endswith(".actions.githubusercontent.com")) and parsed.username is None and parsed.password is None
                       and not parsed.fragment, "Invalid artifact storage redirect")
              # 署名済みstorage URLへAPI認証headerを転送しない。URL自体も例外・ログへ含めない。
              try:
                  archive = open_request(urllib.request.Request(location), timeout)
              except (OSError, urllib.error.URLError):
                  raise CohortError("Artifact storage request failed") from None
              _require(archive.code == 200, "Artifact storage download failed")
              data = archive.read(MAX_BYTES + 1)
              _require(len(data) <= MAX_BYTES, "Artifact archive exceeds its bound")
              return data

          def source_deadline(started_at, *, now):
              if started_at is None:
                  return None
              canonical = canonical_timestamp(started_at)
              _require(canonical == started_at, "Source journal timestamp is not canonical UTC")
              started = datetime.fromisoformat(canonical.replace("Z", "+00:00")).timestamp()
              _require(started <= now, "Future source latch clock")
              result = started + 5400
              return int(result) if result.is_integer() else result

          def _repository_name(value):
              return isinstance(value, str) and re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", value) is not None

          def load_cohort(artifact_id, digest, *, expected_owner, expected_segment, read_json, read_archive, budget, deadline, member_ids=None, trusted_workflow_blob=None):
              _require(_integer(artifact_id) and _digest(digest) and _integer(expected_owner)
                       and (expected_segment is None or type(expected_segment) is int and 1 <= expected_segment <= 4), "Invalid cohort binding")
              repository = os.environ.get("GITHUB_REPOSITORY", "")
              _require(_repository_name(repository), "Missing exact repository context")
              reader = _Reader(read_json, read_archive, budget, deadline, trusted_workflow_blob)
              header, metadata = reader.artifact({"artifact_id": artifact_id, "artifact_digest": digest}, "cohort", repository,
                                                 expected_producer=expected_owner)
              _require(header["owner_run_attempt"] == 1 and type(header["owner_run_attempt"]) is int
                       and header["repository"] == repository and _integer(header["repository_id"])
                       and _hex(header["workflow_sha"], 40) and _hex(header["workflow_blob_sha"], 40)
                       and _integer(header["root_deadline_epoch"]) and time.time() < header["root_deadline_epoch"],
                       "Invalid cohort header identity/clock")
              reader.deadline = min(reader.deadline, header["root_deadline_epoch"])
              content = dict(header)
              content.pop("cohort_digest")
              _require(_hex(header["cohort_digest"], 64) and hashlib.sha256(canonical(content)).hexdigest() == header["cohort_digest"], "Cohort canonical digest")
              producer = reader.producer(repository, expected_owner, header["workflow_sha"], header["workflow_blob_sha"])
              _require(repository_matches(producer.get("repository"), repository, header["repository_id"])
                       and metadata["workflow_run"].get("repository_id") == header["repository_id"]
                       and metadata["workflow_run"].get("head_repository_id") == header["repository_id"]
                       and metadata["workflow_run"].get("head_sha") == header["workflow_sha"], "Cohort repository/workflow binding")
              identifiers = header["member_ids"]
              _require(isinstance(identifiers, list) and 1 <= len(identifiers) <= MAX_MEMBERS
                       and all(_integer(identifier) for identifier in identifiers) and identifiers == sorted(set(identifiers)), "Cohort member reservation cap")
              segments = header["member_segments"]
              _require(isinstance(segments, str) and len(segments) == len(identifiers) and re.fullmatch(r"[1-4]+", segments), "Invalid member segment index")
              indexed_segments = dict(zip(identifiers, map(int, segments)))
              selected = ({identifier for identifier in identifiers if expected_segment is None or indexed_segments[identifier] == expected_segment}
                          if member_ids is None else member_ids)
              _require(isinstance(selected, set) and selected and selected <= set(identifiers), "Foreign selective member")
              selected_segments = {indexed_segments[identifier] for identifier in selected}
              _require(isinstance(header["member_pages"], list) and len(header["member_pages"]) == (len(identifiers) + 49) // 50
                       and isinstance(header["batches"], list) and 1 <= len(header["batches"]) <= 4
                       and set(indexed_segments.values()) == set(range(1, len(header["batches"]) + 1)), "Invalid cohort page count")
              _require(isinstance(header["alias_pages"], list) and len(header["alias_pages"]) == (len(identifiers) + 49) // 50, "Invalid alias page count")
              all_refs = [_ref(ref) for ref in header["member_pages"] + header["alias_pages"] + header["batches"] + [header["root_journal"]]]
              _require(len({ref["artifact_id"] for ref in all_refs}) == len(all_refs), "Duplicate cohort child artifact")
              journals, owner_ids = {}, {}
              for index, reference in enumerate(header["member_pages"]):
                  slice_ids = identifiers[index * 50:(index + 1) * 50]
                  if not selected.intersection(slice_ids):
                      continue
                  page, _ = reader.artifact(reference, "members", repository, expected_producer=expected_owner)
                  entries = page["entries"]
                  _require(isinstance(entries, list) and len(entries) == len(slice_ids), "Invalid source reference page")
                  local_ids = []
                  for entry in entries:
                      _require(isinstance(entry, list) and len(entry) == 4 and all(_integer(value) for value in entry[:3]) and _digest(entry[3]), "Malformed journal reference")
                      identifier, creator, journal_id, journal_digest = entry
                      local_ids.append(identifier)
                      if identifier in selected:
                          journal, journal_metadata = reader.artifact({"artifact_id": journal_id, "artifact_digest": journal_digest}, "source", repository, expected_producer=creator)
                          _require(type(journal["producer_run_attempt"]) is int and journal["producer_run_attempt"] == 1
                                   and journal["repository"] == repository and journal["repository_id"] == header["repository_id"]
                                   and _integer(journal["root_deadline_epoch"]) and journal["root_deadline_epoch"] >= header["root_deadline_epoch"], "Journal original root clock/binding")
                          validate_journal_clock(journal, reader)
                          member = validate_member(journal["member"])
                          _require(member["source_run_id"] == identifier and member["repository"] == repository
                                   and member["repository_id"] == header["repository_id"], "Member source identity drift")
                          journal_producer = reader.producer(repository, creator, journal["workflow_sha"], journal["workflow_blob_sha"])
                          _require(repository_matches(journal_producer.get("repository"), repository, header["repository_id"])
                                   and journal_metadata["workflow_run"].get("head_sha") == journal["workflow_sha"], "Journal producer repository/workflow drift")
                          journals[identifier] = member
                          owner_ids[identifier] = creator
                  _require(local_ids == slice_ids, "Incomplete/duplicate/unsorted source page")
              _require(set(journals) == selected, "Missing selected member proof")
              targets = {}
              for segment in sorted(selected_segments):
                  batch, _ = reader.artifact(header["batches"][segment - 1], "batch", repository, expected_producer=expected_owner)
                  _require(type(batch["segment"]) is int and batch["segment"] == segment, "Wrong cohort segment")
                  entries = batch["target_members"]
                  _require(isinstance(entries, list) and 1 <= len(entries) <= MAX_BATCH_TARGETS, "Early target cap")
                  numbers, batch_ids = [], []
                  for entry in entries:
                      _require(isinstance(entry, list) and len(entry) == 2 and _integer(entry[0]) and isinstance(entry[1], list)
                               and entry[1] and all(_integer(identifier) for identifier in entry[1]) and entry[1] == sorted(set(entry[1])), "Invalid target/member mapping")
                      number, ids = entry
                      numbers.append(number)
                      batch_ids.extend(ids)
                      _require(number not in targets, "Duplicate cohort target")
                      targets[number] = ids
                      for identifier in set(ids) & selected:
                          _require(journals[identifier]["pr_number"] == number, "Member target drift")
                  _require(numbers == sorted(set(numbers)) and len(batch_ids) == len(set(batch_ids))
                           and sorted(batch_ids) == [identifier for identifier in identifiers if indexed_segments[identifier] == segment], "Incomplete batch member union")
              root_journal, root_metadata = reader.artifact(header["root_journal"], "source", repository)
              _require(root_journal["root_deadline_epoch"] == header["root_deadline_epoch"]
                       and root_journal["repository_id"] == header["repository_id"], "Original root clock reset")
              validate_journal_clock(root_journal, reader)
              root_producer = reader.producer(repository, root_journal["producer_run_id"], root_journal["workflow_sha"], root_journal["workflow_blob_sha"])
              _require(repository_matches(root_producer.get("repository"), repository, header["repository_id"])
                       and root_metadata["workflow_run"].get("head_sha") == root_journal["workflow_sha"], "Root clock creator drift")
              return {"header": header, "members_by_id": journals, "target_members_by_number": targets,
                      "registered_writers": {}, "artifact_id": artifact_id, "artifact_digest": digest,
                      "cohort_digest": header["cohort_digest"], "producer_ids_by_member": owner_ids, "loaded_segments": sorted(selected_segments), "trusted_workflow_blob": trusted_workflow_blob,
                      "recovered_predecessor_ids": sorted(reader.cache.get("recovered_predecessor_ids", set()))}

          def drain_owner_backend(reader, repository, producer, repository_id, sha):
              identifier = producer["id"]
              created = producer.get("created_at")
              _require(_utc_epoch(created) <= time.time(), "Failed owner creation timestamp missing/future")
              query = urllib.parse.urlencode({"created": ">=" + created, "per_page": 100, "page": 1})
              endpoint = f"repos/{repository}/actions/workflows/pr-governance-status-writer.yml/runs?{query}"
              snapshot = reader.request(endpoint)
              runs = snapshot.get("workflow_runs")
              _require(type(snapshot.get("total_count")) is int and isinstance(runs, list)
                       and snapshot["total_count"] == len(runs) <= 100 and all(isinstance(run, dict) and _integer(run.get("id")) for run in runs)
                       and len({run["id"] for run in runs}) == len(runs), "Incomplete failed backend drain inventory")
              for run in runs:
                  title = run.get("display_title", "")
                  if not isinstance(title, str) or not title.startswith(f"source={identifier} "):
                      continue
                  _require(re.fullmatch(rf"source={identifier} scope=(?:early|all) segment=[0-4]", title)
                           and run.get("event") == "workflow_dispatch" and run.get("run_attempt") == 1
                           and run.get("head_sha") == sha and run.get("head_branch") == producer.get("head_branch")
                           and run.get("path") in {".github/workflows/pr-governance-status-writer.yml", ".github/workflows/pr-governance-status-writer.yml@" + producer["head_branch"]}
                           and repository_matches(run.get("repository"), repository, repository_id), "Foreign failed owner backend")
                  before = reader.request(f"repos/{repository}/actions/runs/{run['id']}")
                  _require(before == run, "Failed backend drain listing drift")
                  if before.get("status") != "completed":
                      _require(before.get("status") in ACTIVE and before.get("conclusion") is None, "Invalid failed backend state")
                      raise RecoveryNotDrained("Failed owner backend is still active")
                  _require(before.get("conclusion") in {"success", "failure", "cancelled", "timed_out", "action_required", "neutral", "skipped"}, "Unknown failed backend terminal state")
                  after = reader.request(f"repos/{repository}/actions/runs/{run['id']}")
                  _require(after == before, "Failed backend terminal double-read drift")
              _require(reader.request(endpoint) == snapshot, "Failed backend inventory changed during drain")

          def sensor_cohort_binding(check, writer, source, current_pr, *, read_json, read_archive, budget, deadline, workflow_blob):
              details = check.get("details_url")
              query = urllib.parse.parse_qs(urllib.parse.urlsplit(details).query, keep_blank_values=True)
              required = {"source_run_id", "cohort_artifact_id", "cohort_artifact_digest", "cohort_segment",
                          "ci_workflow_id", "ci_run_id", "ci_run_number", "ci_run_attempt", "ci_status", "ci_conclusion",
                          "release_workflow_id", "release_run_id", "release_run_number", "release_run_attempt",
                          "release_status", "release_conclusion", "pr_base_sha", "pr_head_sha", "pr_body_sha256"}
              _require(set(query) == required and all(len(values) == 1 for values in query.values()), "Ambiguous cohort Check Run query")
              title = re.fullmatch(r"source=([1-9][0-9]*) scope=early segment=([1-4])", writer.get("display_title", ""))
              _require(title is not None and query["cohort_segment"] == [title[2]], "Cohort writer segment drift")
              _require(_integer(check.get("id")) and _integer(writer.get("id")) and _integer(source.get("id")), "Cohort Check Run identities missing")
              _require(re.fullmatch(r"[1-9][0-9]*", query["cohort_artifact_id"][0]) and _digest(query["cohort_artifact_digest"][0]), "Invalid cohort Check Run artifact")
              cohort = load_cohort(int(query["cohort_artifact_id"][0]), query["cohort_artifact_digest"][0],
                                   expected_owner=int(title[1]), expected_segment=int(title[2]),
                                   member_ids={source["id"]}, read_json=read_json, read_archive=read_archive,
                                   budget=budget, deadline=deadline, trusted_workflow_blob=workflow_blob)
              verify_cohort_lease(cohort, phase="early", read_json=read_json, budget=budget, deadline=deadline)
              _require(cohort["registered_writers"].get(int(title[2])) == writer["id"], "Unregistered cohort writer")
              member = resolve_member_clock(cohort["members_by_id"][source["id"]], read_json=read_json, budget=budget, deadline=deadline)
              _require(member_source_matches(member, source, current_pr), "Current member source/PR drift")
              ids = cohort["target_members_by_number"].get(member["pr_number"], [])
              _require(source["id"] in ids and query["source_run_id"][0].isdigit() and int(query["source_run_id"][0]) in ids,
                       "Cohort Check Run belongs to another target/member")
              _require(query["pr_base_sha"] == [member["base_sha"]] and query["pr_head_sha"] == [member["head_sha"]]
                       and query["pr_body_sha256"] == [member["pr_body_sha256"]], "Cohort Check Run current tuple drift")
              for prefix in ("ci", "release"):
                  _require(query[prefix + "_status"] == ["completed"] and query[prefix + "_conclusion"] == ["success"]
                           and query[prefix + "_run_attempt"] == ["1"]
                           and all(re.fullmatch(r"[1-9][0-9]*", query[prefix + key][0]) for key in ("_workflow_id", "_run_id", "_run_number")),
                           "Cohort CI proof is incomplete")
              return min(member["source_deadline_epoch"], cohort["header"]["root_deadline_epoch"])

          def sensor_archive_read(endpoint, *, timeout, deadline, budget, token, primary):
              storage_reads = 0
              def open_request(request, requested_timeout):
                  nonlocal storage_reads
                  if storage_reads:
                      budget.charge()
                  else:
                      primary["hits"] += 1
                  storage_reads += 1
                  remaining = deadline - time.monotonic()
                  _require(remaining > 0, "Sensor original artifact deadline elapsed")
                  return _open_no_redirect(request, min(20, requested_timeout, remaining))
              value = read_artifact_archive(endpoint, token, timeout, open_request=open_request)
              _require(time.monotonic() < deadline, "Sensor original artifact deadline elapsed")
              return value
          PY

      - name: Await matching trusted governance Check Run
        if: ${{ github.run_attempt == 1 && github.event.pull_request.draft == false && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == github.event.repository.default_branch }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          CHECK_APP_ID: ${{ vars.KRR_GOVERNANCE_APP_ID }}
          # 600 * 8.1 = 4,860 seconds. Sixty-second polls permit at most
          # 91 bounded three-read Check Run polls within this 90-minute wait.
          POLL_INTERVAL_SECONDS: '60'
          POLL_TIMEOUT_SECONDS: '5400'
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from urllib.parse import parse_qs, urlencode, urlsplit

          check_name = "KRR / PR governance (trusted check)"
          sha_pattern = re.compile(r"^[0-9a-fA-F]{40}$")
          positive_number = re.compile(r"^[1-9][0-9]*$")
          workflow_ref_pattern = re.compile(r"^[A-Za-z0-9._/-]+$")
          sensor_events = {
              "pull_request",
              "pull_request_review",
              "pull_request_review_comment",
          }
          sensor_workflow = ".github/workflows/pr-governance-review-events.yml"
          writer_workflow = ".github/workflows/pr-governance-status-writer.yml"
          # The reconciler's complete operating boundary.  The timeout below
          # intentionally covers one such generation plus a fixed hand-off
          # cushion, rather than granting an unbounded wait to the latch.
          max_reconciliation_heads = 600
          check_write_pace_seconds = 8.1
          min_reconciliation_seconds = int(max_reconciliation_heads * check_write_pace_seconds)
          max_latch_timeout_seconds = 5400
          # One repository identity read, one source validation, up to 91
          # bounded three-read source-bound Check Run polls (page one plus
          # two progressing pages, with a final page-one race anchor), then
          # repository/source/writer
          # revalidation on success remain below this request budget.
          max_latch_api_reads = 300

          def fail(message: str) -> None:
              print(message, file=sys.stderr)
              raise SystemExit(1)

          head_sha = os.environ.get("HEAD_SHA", "")
          pr_number = os.environ.get("PR_NUMBER", "")
          pr_base_sha = os.environ.get("PR_BASE_SHA", "")
          pr_base_ref = os.environ.get("PR_BASE_REF", "")
          default_branch = os.environ.get("DEFAULT_BRANCH", "")
          source_run_id = os.environ.get("SOURCE_RUN_ID", "")
          app_id = os.environ.get("CHECK_APP_ID", "")
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          repository_pattern = re.compile(r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")
          if repository_pattern.fullmatch(repository) is None:
              fail("GitHub repository identity is invalid.")
          repository_name = repository.rsplit("/", 1)[1]
          repository_url = f"https://api.github.com/repos/{repository}"
          try:
              server_url = urlsplit(os.environ.get("GITHUB_SERVER_URL", ""))
          except ValueError:
              fail("GitHub server URL is invalid.")
          if (
              sha_pattern.fullmatch(head_sha) is None
              or sha_pattern.fullmatch(pr_base_sha) is None
          ):
              fail("PR head SHA is invalid.")
          if (
              positive_number.fullmatch(pr_number) is None
              or positive_number.fullmatch(source_run_id) is None
              or not repository
              or workflow_ref_pattern.fullmatch(pr_base_ref) is None
              or workflow_ref_pattern.fullmatch(default_branch) is None
              or default_branch in {".", ".."}
              or default_branch.startswith("/")
              or "//" in default_branch
              or any(part in {"", ".", ".."} for part in default_branch.split("/"))
              or pr_base_ref != default_branch
              or pr_base_ref in {".", ".."}
              or pr_base_ref.startswith("/")
              or "//" in pr_base_ref
              or any(part in {"", ".", ".."} for part in pr_base_ref.split("/"))
          ):
              fail("Sensor source run identity is invalid.")
          if positive_number.fullmatch(app_id) is None:
              fail("KRR_GOVERNANCE_APP_ID is not configured.")
          if (
              server_url.scheme != "https"
              or not server_url.netloc
              or server_url.path not in {"", "/"}
              or server_url.query
              or server_url.fragment
          ):
              fail("GitHub server URL is invalid.")
          writer_generation_pattern = re.compile(
              rf"^krr-governance/v1/{re.escape(head_sha.lower())}/writer-([1-9][0-9]*)$"
          )
          dispatcher_generation_pattern = re.compile(
              rf"^krr-governance/v1/{re.escape(head_sha.lower())}/dispatcher-([1-9][0-9]*)$"
          )

          try:
              interval = int(os.environ["POLL_INTERVAL_SECONDS"])
              timeout = int(os.environ["POLL_TIMEOUT_SECONDS"])
          except (KeyError, ValueError):
              fail("Governance latch polling configuration is invalid.")
          check_run_polls = 1 + (timeout + interval - 1) // interval if interval > 0 else 0
          if (
              interval < 1
              or timeout < min_reconciliation_seconds
              or timeout > max_latch_timeout_seconds
              or check_run_polls * 3 + 3 > max_latch_api_reads
          ):
              fail("Governance latch polling configuration is invalid.")

          import runpy, stat
          from pathlib import Path
          reader_path = Path(os.environ["RUNNER_TEMP"]) / "krr-governance-sensor-reader.py"
          reader_stat = reader_path.lstat()
          if not stat.S_ISREG(reader_stat.st_mode) or reader_stat.st_uid != os.getuid() or reader_stat.st_mode & 0o077:
              fail("Trusted sensor reader file boundary is invalid.")
          reader_namespace = runpy.run_path(str(reader_path), init_globals=globals())
          PINNED_DISPATCHER_WORKFLOW_BLOB_SHA = reader_namespace["PINNED_DISPATCHER_WORKFLOW_BLOB_SHA"]
          cohort_reader_path = Path(os.environ["RUNNER_TEMP"]) / "krr-governance-cohort-reader.py"
          cohort_reader_stat = cohort_reader_path.lstat()
          if not stat.S_ISREG(cohort_reader_stat.st_mode) or cohort_reader_stat.st_uid != os.getuid() or cohort_reader_stat.st_mode & 0o077:
              fail("Trusted cohort reader file boundary is invalid.")
          cohort_reader_namespace = runpy.run_path(str(cohort_reader_path))
          for reader_name in (
              "workflow_path_matches", "details_writer_run_id", "repository_rest_identity",
              "source_repository_matches", "sensor_run_matches", "writer_run_matches",
              "dispatcher_run_matches", "all_scope_writer_run_matches", "check_matches_source",
          ):
              globals()[reader_name] = reader_namespace[reader_name]

          api_read_count = 0
          class SensorReadBudget:
              def charge(self):
                  global api_read_count
                  if api_read_count >= max_latch_api_reads:
                      fail("Sensor API read budget is exhausted.")
                  api_read_count += 1
          sensor_read_budget = SensorReadBudget()

          api_response_cache = {}
          primary_quota = {"hits": 0}
          def api_json(endpoint, failure, *, terminal_page=False, inspect_link=False,
                       cohort_precharged=False, request_timeout=20):
              try:
                  return cohort_reader_namespace["sensor_json_request"](
                      endpoint, budget=sensor_read_budget, cache=api_response_cache, primary=primary_quota,
                      precharged=cohort_precharged, request_timeout=request_timeout,
                      deadline=globals().get("deadline", float("inf")), terminal_page=terminal_page,
                      inspect_link=inspect_link, run=subprocess.run, authenticated=bool(os.environ.get("GH_TOKEN")),
                  )
              except (ValueError, RuntimeError, subprocess.TimeoutExpired):
                  fail(failure)

          def cohort_json_read(relative_endpoint, *, timeout):
              value = api_json(relative_endpoint, "Cohort JSON proof is invalid.", cohort_precharged=True, request_timeout=timeout)
              if not isinstance(value, dict):
                  fail("Cohort JSON proof is not an object.")
              return value

          def cohort_archive_read(relative_endpoint, *, timeout):
              return cohort_reader_namespace["sensor_archive_read"](
                  relative_endpoint, timeout=timeout, deadline=deadline,
                  budget=sensor_read_budget, token=os.environ.get("GH_TOKEN", ""), primary=primary_quota,
              )

          endpoint = f"repos/{repository}/commits/{head_sha}/check-runs?" + urlencode({"check_name": check_name, "app_id": app_id, "filter": "all", "per_page": 100})

          def check_run_page(
              page: int,
              *,
              terminal_page: bool = False,
              inspect_link: bool = False,
          ) -> tuple[int, list[dict[str, object]], set[int]]:
              value = api_json(
                  endpoint + f"&page={page}",
                  "Unable to read the trusted governance Check Run.",
                  terminal_page=terminal_page,
                  inspect_link=inspect_link,
              )
              has_next = False
              if inspect_link:
                  if (
                      not isinstance(value, tuple)
                      or len(value) != 2
                      or type(value[1]) is not bool
                  ):
                      fail("Trusted governance Check Run response is invalid.")
                  value, has_next = value
              if not isinstance(value, dict) or type(value.get("total_count")) is not int:
                  fail("Trusted governance Check Run response is invalid.")
              total_count = value["total_count"]
              runs = value.get("check_runs")
              if total_count < 0 or not isinstance(runs, list) or len(runs) > 100:
                  fail("Trusted governance Check Run response is invalid.")
              if inspect_link and total_count <= 100 and has_next:
                  fail("Trusted governance Check Run response changed during pagination.")
              identifiers: set[int] = set()
              for run in runs:
                  identifier = run.get("id") if isinstance(run, dict) else None
                  if type(identifier) is not int or identifier < 1 or identifier in identifiers:
                      fail("Trusted governance Check Run response is invalid.")
                  identifiers.add(identifier)
              return total_count, runs, identifiers

          # Historical runs for an unchanged SHA are retained indefinitely.
          # A fresh sensor's Check Run can therefore be behind more than two
          # 100-entry pages.  Scan the exact check-name/app/head endpoint in
          # bounded source pages instead of making that history a terminal
          # failure. Each poll reads page one and at most two new pages. A
          # normal page-one transition (a new Check Run or a status update)
          # restarts the bounded snapshot; only an unchanged final page-one
          # anchor may authorize a candidate. This preserves the three-read
          # per-poll budget above.
          source_pages_per_poll = 2
          max_source_check_pages = 1 + source_pages_per_poll * (check_run_polls - 1)
          check_scan: dict[str, object] = {}

          def begin_source_check_scan(
              total_count: int,
              first_page: list[dict[str, object]],
              first_identifiers: set[int],
          ) -> None:
              page_count = max(1, (total_count + 99) // 100)
              if (
                  page_count > max_source_check_pages
                  or len(first_page) != min(total_count, 100)
              ):
                  fail("Trusted governance Check Run response exceeds the bounded source page window.")
              check_scan.clear()
              check_scan.update({
                  "snapshot": (total_count, first_page, first_identifiers),
                  "page_count": page_count,
                  "next_page": 2,
                  "identifiers": set(first_identifiers),
                  "matches": [check for check in first_page if check_matches_source(check)],
                  # A one-page (including empty) response gets its terminal
                  # Link fence on the next page-one anchor read.
                  "complete": False,
              })

          def newest_source_bound_check_runs(
              matches: list[dict[str, object]],
          ) -> list[dict[str, object]]:
              """Select one latest writer generation; duplicates stay fail-closed.

              A single live sensor can receive several governed-event
              reconciliations.  Every resulting trusted Check Run is bound to
              that sensor, but only the newest writer generation represents
              its current state.  Actions run identifiers are positive,
              repository-unique generations, so the largest writer run id is
              the authoritative generation.  Multiple Check Runs for that
              same newest writer are ambiguous and cannot satisfy the latch.
              """
              newest_writer_run_id: int | None = None
              newest: list[dict[str, object]] = []
              for check in matches:
                  writer_run_id = details_writer_run_id(check.get("details_url"))
                  if writer_run_id is None:
                      fail("Trusted governance Check Run writer generation is invalid.")
                  writer_generation = int(writer_run_id)
                  if newest_writer_run_id is None or writer_generation > newest_writer_run_id:
                      newest_writer_run_id = writer_generation
                      newest = [check]
                  elif writer_generation == newest_writer_run_id:
                      newest.append(check)
              if len(newest) > 1:
                  fail("Multiple trusted governance Check Runs match the newest sensor generation.")
              return newest

          def source_bound_generation(check: dict[str, object]) -> int:
              """Return the immutable writer generation of a source-bound Check Run."""
              writer_run_id = details_writer_run_id(check.get("details_url"))
              if writer_run_id is None:
                  fail("Trusted governance Check Run writer generation is invalid.")
              return int(writer_run_id)

          def source_bound_trusted_check_runs() -> list[dict[str, object]] | None:
              # A one-page snapshot needs its Link fence on the final anchor.
              # Request the headers without prematurely rejecting a normal
              # one-to-many page transition before it can be restarted.
              first = check_run_page(
                  1,
                  inspect_link=bool(check_scan.get("page_count") == 1),
              )
              if not check_scan:
                  begin_source_check_scan(*first)
              elif first != check_scan.get("snapshot"):
                  # Check Run ordering and history can change between polls.
                  # The old snapshot, including any candidate collected from
                  # it, is never reusable; restart from this complete page-one
                  # snapshot and require its own final stable anchor.
                  begin_source_check_scan(*first)
              if check_scan["complete"]:
                  matches = check_scan["matches"]
                  if not isinstance(matches, list):
                      fail("Trusted governance Check Run scan is invalid.")
                  matches = newest_source_bound_check_runs(matches)
                  check_scan.clear()
                  return matches

              total_count, _, _ = first
              page_count = check_scan.get("page_count")
              next_page = check_scan.get("next_page")
              identifiers = check_scan.get("identifiers")
              matches = check_scan.get("matches")
              if (
                  type(page_count) is not int
                  or type(next_page) is not int
                  or not isinstance(identifiers, set)
                  or not isinstance(matches, list)
              ):
                  fail("Trusted governance Check Run scan is invalid.")
              for _ in range(source_pages_per_poll):
                  if next_page > page_count:
                      check_scan["complete"] = True
                      break
                  page_total, page, page_identifiers = check_run_page(
                      next_page,
                      terminal_page=next_page == page_count,
                  )
                  expected_count = min(100, total_count - 100 * (next_page - 1))
                  if (
                      page_total != total_count
                      or len(page) != expected_count
                      or identifiers & page_identifiers
                  ):
                      fail("Trusted governance Check Run response changed during pagination.")
                  identifiers.update(page_identifiers)
                  matches.extend(check for check in page if check_matches_source(check))
                  next_page += 1
                  check_scan["next_page"] = next_page
              if next_page > page_count:
                  check_scan["complete"] = True
              return None

          deadline = time.monotonic() + timeout
          repository_identity = repository_rest_identity(
              api_json(f"repos/{repository}", "Repository REST identity is invalid.")
          )
          if repository_identity is None:
              fail("Repository REST identity is invalid.")
          if not sensor_run_matches(
              api_json(f"repos/{repository}/actions/runs/{source_run_id}", "Sensor source run is invalid."),
              repository_identity,
          ):
              fail("Sensor source run is invalid.")

          failed_generation = 0
          while True:
              matches = source_bound_trusted_check_runs()
              if matches is None:
                  if time.monotonic() >= deadline:
                      fail("Timed out waiting for a matching trusted governance Check Run.")
                  time.sleep(interval)
                  continue
              if matches:
                  terminal = matches[0]
                  terminal_generation = source_bound_generation(terminal)
                  if terminal.get("status") == "completed" and terminal.get("conclusion") == "success":
                      if terminal_generation <= failed_generation:
                          fail("Trusted governance Check Run did not advance after terminal failure.")
                      writer_run_id = str(terminal_generation)
                      if repository_rest_identity(
                          api_json(f"repos/{repository}", "Repository REST identity is invalid.")
                      ) != repository_identity:
                          fail("Repository REST identity changed.")
                      if not sensor_run_matches(
                          api_json(f"repos/{repository}/actions/runs/{source_run_id}", "Sensor source run is invalid."),
                          repository_identity,
                      ):
                          fail("Sensor source run is invalid.")
                      writer_run = api_json(
                          f"repos/{repository}/actions/runs/{writer_run_id}",
                          "Trusted governance writer run is invalid.",
                      )
                      terminal_query = parse_qs(urlsplit(terminal["details_url"]).query, keep_blank_values=True)
                      try:
                          cohort_identity = cohort_reader_namespace["sensor_writer_title_binding"](writer_run, terminal_query)
                      except (ValueError, RuntimeError):
                          fail("Cohort writer title and query segment differ.")
                      writer_generation = writer_generation_pattern.fullmatch(terminal["external_id"])
                      dispatcher_generation = dispatcher_generation_pattern.fullmatch(terminal["external_id"])
                      if writer_generation is not None:
                          if writer_generation.group(1) != writer_run_id or not writer_run_matches(
                              writer_run, writer_run_id, repository_identity, **cohort_identity,
                          ):
                              fail("Trusted governance writer run is invalid.")
                      elif dispatcher_generation is not None:
                          dispatcher_run_id = dispatcher_generation.group(1)
                          dispatcher_run = api_json(
                              f"repos/{repository}/actions/runs/{dispatcher_run_id}",
                              "Trusted governance dispatcher run is invalid.",
                          )
                          if not dispatcher_run_matches(
                              dispatcher_run, dispatcher_run_id, repository_identity,
                          ):
                              fail("Trusted governance dispatcher run is invalid.")
                          dispatcher_head_sha = dispatcher_run.get("head_sha") if isinstance(dispatcher_run, dict) else None
                          if not isinstance(dispatcher_head_sha, str) or not all_scope_writer_run_matches(
                              writer_run, writer_run_id, dispatcher_run_id,
                              dispatcher_head_sha, repository_identity,
                          ):
                              fail("Trusted governance all-scope writer run is invalid.")
                      else:
                          fail("Trusted governance Check Run writer generation is invalid.")
                      cohort_query = parse_qs(urlsplit(terminal["details_url"]).query, keep_blank_values=True)
                      if "cohort_artifact_id" in cohort_query:
                          current_pr = api_json(f"repos/{repository}/pulls/{pr_number}", "Cohort current PR is invalid.")
                          current_source = api_json(f"repos/{repository}/actions/runs/{source_run_id}", "Cohort current source is invalid.")
                          try:
                              original_boundary = cohort_reader_namespace["sensor_cohort_binding"](
                                  terminal, writer_run, current_source, current_pr,
                                  read_json=cohort_json_read, read_archive=cohort_archive_read,
                                  budget=sensor_read_budget, deadline=time.time() + deadline - time.monotonic(),
                                  workflow_blob=PINNED_DISPATCHER_WORKFLOW_BLOB_SHA,
                              )
                          except (ValueError, RuntimeError, TypeError, KeyError):
                              fail("Cohort sensor membership or writer proof is invalid.")
                          if time.time() >= original_boundary:
                              fail("Cohort sensor original source/root deadline elapsed.")
                      elif re.fullmatch(r"source=[1-9][0-9]* scope=early segment=[1-4]", writer_run.get("display_title", "")):
                          fail("Cohort writer is missing its immutable membership proof.")
                      raise SystemExit(0)
                  if terminal.get("status") == "completed":
                      # Review-thread resolution does not emit an Actions event.
                      # Keep the required latch pending until a fresh trusted
                      # dispatcher/writer generation records the repaired state.
                      failed_generation = max(failed_generation, terminal_generation)

              if time.monotonic() >= deadline:
                  fail("Timed out waiting for a matching trusted governance Check Run.")
              time.sleep(interval)
          PY
