          def sensor_json_request(endpoint, *, budget, cache, primary, precharged, request_timeout, deadline,
                                  terminal_page, inspect_link, run, authenticated):
              if not precharged:
                  budget.charge()
              remaining = deadline - time.monotonic()
              _require(remaining > 0, "Sensor original deadline elapsed")
              arguments = ["gh", "api", "--include"]
              previous = cache.get(endpoint)
              if previous is not None:
                  arguments.extend(["-H", "If-None-Match: " + previous[0]])
              arguments.append(endpoint)
              try:
                  result = run(arguments, capture_output=True, text=True, check=False, timeout=min(20, request_timeout, remaining))
              except TimeoutError as error:
                  raise CohortError("Sensor API timeout") from error
              _require(result.returncode in {0, 1} and time.monotonic() < deadline, "Sensor API failed or exceeded original deadline")
              headers, separator, raw = result.stdout.replace("\r\n", "\n").partition("\n\n")
              status = re.match(r"HTTP/\S+\s+([0-9]{3})(?:\s|$)", headers)
              _require(separator and status is not None, "Sensor API response headers are invalid")
              etags = re.findall(r"(?im)^etag:\s*([^\r\n]+)$", headers)
              _require(len(etags) <= 1, "Duplicate sensor response ETag")
              etag = etags[0].strip() if etags else None
              _require(etag is None or re.fullmatch(r'(?:W/)?"[!\x23-\x7e]{1,1024}"', etag), "Invalid sensor response ETag")
              has_next = re.search(r'(?im)^link:.*rel="next"', headers) is not None
              if status[1] == "304":
                  _require(previous is not None and not raw.strip() and (etag is None or etag == previous[0]), "Unbound or drifted sensor 304")
                  _require(not has_next or previous[2], "Sensor 304 pagination drift")
                  raw, has_next = previous[1], previous[2]
                  if not authenticated:
                      primary["hits"] += 1
              else:
                  primary["hits"] += 1
                  _require(result.returncode == 0 and status[1] == "200", "Sensor API status is invalid")
                  if etag is None:
                      cache.pop(endpoint, None)
                  else:
                      cache[endpoint] = (etag, raw, has_next)
              _require(not terminal_page or not has_next, "Sensor terminal page remains incomplete")
              try:
                  value = json.loads(raw)
              except json.JSONDecodeError as error:
                  raise CohortError("Sensor JSON payload is invalid") from error
              return (value, has_next) if inspect_link else value
          PY

