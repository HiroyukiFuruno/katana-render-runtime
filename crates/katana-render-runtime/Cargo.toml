[package]
name = "katana-render-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true
include = [
    "Cargo.toml",
    "build.rs",
    "assets/fonts/**",
    "assets/test-fixtures/font-probes/**",
    "src/**/*.rs",
    "vendor/svg-engine/**",
    "src/renderer/backends/html_runtime/*.js",
    "src/markdown/diagram_runtime/generated/*.js",
    "src/markdown/diagram_runtime/generated/*.sha256",
    "vendor/drawio/32.5.5/drawio.min.js.sha256",
    "vendor/drawio/32.5.5/LICENSE",
    "vendor/mermaid/12.2.0-krr.pr6823.1/mermaid.min.js.br",
    "vendor/mermaid/12.2.0-krr.pr6823.1/mermaid.min.js.sha256",
    "vendor/mermaid/12.2.0-krr.pr6823.1/LICENSE",
    "vendor/mermaid-zenuml/1.0.1/mermaid-zenuml.min.js.sha256",
    "vendor/plantuml/1.2026.9/plantuml.jar.sha256",
    "vendor/zenuml-core/4.10.7/zenuml.js.sha256",
    "src/markdown/generated/zenuml-runtime-assets.bin.br",
    "src/markdown/drawio_renderer/generated/drawio-resources.bin.br",
]

[lib]
path = "src/lib.rs"

[dependencies]
katana-render-runtime-assets = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
brotli-decompressor = { workspace = true }
include_dir = { workspace = true }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
jni = { workspace = true }
html5ever = { workspace = true }
markup5ever = { workspace = true }
tendril = { workspace = true }
xml5ever = { workspace = true }
bytemuck = "1.25"
data-url = "0.3"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
fontdb = { version = "0.24", default-features = false, features = ["fs", "fontconfig", "memmap"] }
gif = "0.14.1"
image-webp = "0.2.4"
imagesize = "0.15"
rgb = "0.8"
roxmltree = "0.21.1"
siphasher = "1"
strict-num = "0.1.1"
svg_harfrust = { package = "harfrust", version = "0.12.0" }
tiny-skia-path = "0.12"
unicode-bidi = "0.3"
unicode-script = "0.5"
unicode-vo = "0.1"
xmlwriter = "0.1"
zune-jpeg = "0.5.9"
skrifa = "^0.44"
log = "0.4"
rustybuzz = { workspace = true }
harfrust = { workspace = true }
read-fonts = { version = "=0.46.0", default-features = false }
icu_properties = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tiny-skia = { workspace = true }
tracing = { workspace = true }
ureq = { workspace = true }
url = { version = "2.5", features = ["serde"] }
v8 = { workspace = true }
xmltree = { workspace = true }
percent-encoding = { workspace = true }
taffy = { workspace = true }
cssparser = { workspace = true }
kurbo = "=0.13.1"
simplecss = "=0.2.2"
svgtypes = "=0.16.1"
unicode-linebreak = { workspace = true }
unicode-width = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "mount"] }

[target.'cfg(target_os = "macos")'.dependencies]
# 公開済みCPU SDKの最小構成に合わせ、ローカルSkia改変や独自SDKへ依存しない。
skia-safe = { version = "=0.156.0", default-features = false, features = ["binary-cache", "pdf"] }
fontique = { version = "=0.12.0", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFString", "CFURL"] }
objc2-core-text = { version = "=0.3.2", default-features = false, features = ["CTFont", "CTFontDescriptor", "CTFontTraits"] }
write-fonts = { version = "0.55", default-features = false, features = ["read"] }

[build-dependencies]
brotli-decompressor = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
xml = "=1.4.0"

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-graphics = "=0.25.0"
core-foundation = "=0.10.1"
core-text = "=22.0.0"
