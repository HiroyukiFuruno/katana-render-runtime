[package]
name = "katana-render-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true
include = [
    "Cargo.toml",
    "build.rs",
    "assets/fonts/**",
    "src/**/*.rs",
    "src/renderer/backends/html_runtime/*.js",
    "src/markdown/diagram_runtime/generated/*.js",
    "src/markdown/diagram_runtime/generated/*.sha256",
    "vendor/drawio/31.4.5/drawio.min.js.br",
    "vendor/drawio/31.4.5/drawio.min.js.sha256",
    "vendor/mermaid/12.0.0/mermaid.min.js.br",
    "vendor/mermaid/12.0.0/mermaid.min.js.sha256",
    "vendor/mermaid-zenuml/1.0.0/mermaid-zenuml.min.js.sha256",
    "vendor/plantuml/1.2026.8/plantuml.jar.sha256",
    "vendor/zenuml-core/4.3.0/zenuml.js.sha256",
    "src/markdown/generated/zenuml-runtime-assets.bin.br",
    "src/markdown/drawio_renderer/generated/drawio-resources.bin.br",
]

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
brotli-decompressor = { workspace = true }
include_dir = { workspace = true }
jni = { workspace = true }
html5ever = { workspace = true }
markup5ever_rcdom = { workspace = true }
resvg = { workspace = true }
rustybuzz = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tiny-skia = { workspace = true }
tracing = { workspace = true }
ureq = { workspace = true }
url = { version = "2.5", features = ["serde"] }
v8 = { workspace = true }
xmltree = { workspace = true }
percent-encoding = { workspace = true }
taffy = { workspace = true }
cssparser = { workspace = true }
unicode-linebreak = { workspace = true }
unicode-width = { workspace = true }

[build-dependencies]
brotli-decompressor = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
